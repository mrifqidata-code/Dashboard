<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beban Coach</title>
<meta name="description" content="Beban murid aktif per coach, sesi per hari, level murid.">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../assets/shell.css">
<link rel="stylesheet" href="../../assets/report.css">
</head>
<body class="cat-kelas">
<header class="top">
  <div class="wrap top-inner">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/><path d="M8 4v16M16 4v16"/></svg></div>
    <div class="brand">
      <h1>Coach</h1>
      <p id="sub">Kelas</p>
    </div>
    <div class="right">
      <span class="sync" id="status">Memuat…</span>
      <button class="btn icon" id="pullBtn" type="button" aria-label="Tarik ulang data"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="cbar" id="cChips"></div>
  <div class="notice" id="errBox" hidden></div>
  <div id="view"><div class="skel"></div><div class="skel"></div></div>
  <div class="foot" id="foot"></div>
</main>

<script src="../../assets/shell.js"></script>
<script src="../../assets/report.js"></script>
<script>
(function(){
'use strict';
const R = DA.report, {esc} = DA;
const $ = s => document.querySelector(s);
DA.mountNav('kelas-coach');
let center = DA.center.get();
const view = R.start({render, foot: 'Beban coach dibandingkan hanya dengan coach lain di center yang sama. Sesi per hari: merah ≥7 sesi, oranye 6 sesi.'});
const DAYS = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const dayTone = n => n==null ? '' : n >= 7 ? 'hot' : n >= 6 ? 'y' : '';

function render(secs){
  center = DA.centerChips($('#cChips'), DA.CENTERS, c => { center = c; view.redraw(); });
  const sec = secs['11 Coach & Class'], sec8 = secs['08 Class Utilization'];
  const A = R.table(sec, /^A\. KONSUMSI SESI/i), B = R.table(sec, /^B\. LEVEL PROGRESSION/i), C = R.table(sec, /^C\. PENGALAMAN TRIAL/i),
        D = R.table(sec, /^D\. BEBAN COACH/i), G = R.table(sec8, /^G\. SESI PER COACH/i);
  if (!D) return R.empty('Tabel coach belum terbaca', 'Bagian "D. Beban coach" tidak ditemukan di tab 11 Coach & Class.');
  const month = R.monthOf(sec), c = center;
  $('#sub').textContent = `Kelas · ${month}${c==='ALL' ? '' : ' · ' + c}`;
  const val = (t, m) => t ? t.val(m, c) : null;
  const rw = val(A, /^Murid sisa sesi/i);
  let html = `<div class="kpis">
    ${R.kpi('Murid aktif', R.fmt(val(A, /^Murid aktif/i),0), `${R.fmt(val(A, /^Murid Not Started/i),0)} belum mulai`)}
    ${R.kpi('Konsumsi sesi', R.fmtPct(val(A, /^% Konsumsi sesi/i)), `rata-rata sisa ${R.fmt(val(A, /^Rata-rata sisa sesi/i))} sesi/murid`)}
    ${R.kpi('Renewal window', R.fmt(rw,0), `sisa ≤4 sesi · ${R.fmtPct(val(A, /^% murid di renewal/i))}`, rw ? 'y' : '')}
    ${R.kpi('Naik dari Level F', R.fmtPct(val(B, /^% naik dari Level F/i)), `${R.fmt(val(A, /^Graduated/i),0)} graduated`)}
  </div>`;

  // Beban coach: bandingkan dengan rata-rata murid aktif coach lain di center yang sama
  const coaches = D.rows.map(r => ({name: r[D.col], c: D.get(r,'Center'), m: R.num(D.get(r,'Murid Aktif')), slot: R.num(D.get(r,'Slot Kelas')),
      ms: R.num(D.get(r,'Murid / Slot')), rw: R.num(D.get(r,'Renewal Window ≤4'))}))
    .filter(x => x.name && x.c && DA.CENTERS.includes(x.c) && x.m != null);
  const avg = {};
  DA.CENTERS.forEach(k => { const l = coaches.filter(x => x.c===k); avg[k] = l.length ? l.reduce((a, x) => a + x.m, 0) / l.length : null; });
  coaches.forEach(x => { x.hot = avg[x.c] && x.m > avg[x.c] * 1.3; });
  const mine = coaches.filter(x => c==='ALL' || x.c===c).sort((a, b) => c==='ALL' ? (DA.CENTERS.indexOf(a.c) - DA.CENTERS.indexOf(b.c) || b.m - a.m) : b.m - a.m);
  const hot = mine.filter(x => x.hot);
  html += `<div class="sec-head"><h2>Beban coach · murid aktif</h2><span class="note" style="margin:0">${mine.length} coach${hot.length ? ` · <b style="color:var(--crit-ink)">${hot.length} di atas batas</b>` : ''}</span></div>`;
  if (c !== 'ALL' && mine.length) html += `<div class="card">${R.bars(mine.map(x => ({label: x.name, value: x.m, tone: x.hot ? 'r' : '', text: R.fmt(x.m,0), sub: `${R.fmt(x.slot,0)} slot`})), {mark: avg[c]})}
      <p class="note">Garis tipis = rata-rata ${esc(c)} (${R.fmt(avg[c],0)} murid). Merah = lebih dari 30% di atas rata-rata.</p></div>`;
  html += (c==='ALL' ? '' : '<div style="height:12px"></div>') + (mine.length ? R.tbl(['Coach'].concat(c==='ALL' ? ['Center'] : [], ['Murid aktif','Slot','Murid/slot','Renewal ≤4']),
    mine.map(x => ({cells: [esc(x.name)].concat(c==='ALL' ? [x.c] : [], [R.fmt(x.m,0), R.fmt(x.slot,0), R.fmt(x.ms), R.fmt(x.rw,0)]),
      tones: [''].concat(c==='ALL' ? [''] : [], [x.hot ? 'hot' : '', '', '', ''])}))) : R.empty('Belum ada coach', `Belum ada coach tercatat untuk ${esc(c)}.`));
  if (c==='ALL' && hot.length) html += `<p class="note">Merah = murid aktif lebih dari 30% di atas rata-rata coach di center yang sama.</p>`;

  if (G){
    // Baris center ("— semua coach —") diikuti baris coach dengan kolom Center kosong
    let cur = '';
    const g = [];
    G.rows.forEach(r => {
      const cn = G.get(r,'Center'), name = G.get(r,'Coach');
      if (cn) cur = cn;
      if (!cur || !name || name==='-') return;
      g.push({c: cur, name, total: /semua coach/i.test(name), week: R.num(G.get(r,'Sesi / Minggu')), days: DAYS.map(d => R.num(G.get(r, d)))});
    });
    const cells = x => x.days.map(n => n==null ? '–' : R.fmt(n,0));
    if (c==='ALL'){
      const busy = g.filter(x => !x.total && x.days.some(n => n >= 7)).sort((a, b) => Math.max(...b.days.map(n => n || 0)) - Math.max(...a.days.map(n => n || 0)));
      html += `<div class="sec-head"><h2>Sesi per hari · total center</h2></div>` + R.tbl(['Center','Minggu ini'].concat(DAYS.map(d => d.slice(0,3))),
        g.filter(x => x.total).map(x => ({cells: [x.c, R.fmt(x.week,0)].concat(cells(x))})));
      html += `<div class="sec-head"><h2>Coach dengan hari padat (≥7 sesi)</h2></div>` + (busy.length ? R.tbl(['Coach','Center','Minggu ini'].concat(DAYS.map(d => d.slice(0,3))),
        busy.map(x => ({cells: [esc(x.name), x.c, R.fmt(x.week,0)].concat(cells(x)), tones: ['','',''].concat(x.days.map(dayTone))}))) : '<p class="note">Tidak ada coach dengan 7 sesi atau lebih dalam sehari.</p>');
    } else {
      const list = g.filter(x => x.c===c && !x.total && x.week != null).sort((a, b) => b.week - a.week);
      html += `<div class="sec-head"><h2>Sesi per coach per hari</h2><span class="note" style="margin:0">Merah ≥7 · oranye 6</span></div>` + (list.length ? R.tbl(['Coach','Minggu ini'].concat(DAYS.map(d => d.slice(0,3))),
        list.map(x => ({cells: [esc(x.name), R.fmt(x.week,0)].concat(cells(x)), tones: ['',''].concat(x.days.map(dayTone))}))) : '<p class="note">Belum ada jadwal coach untuk center ini.</p>');
    }
  }

  if (B){
    const lv = ['Level F (dasar)','Level 1','Level 2','Level 3'].map(l => ({label: l.replace(' (dasar)',''), value: val(B, l) || 0}));
    const tot = lv.reduce((a, x) => a + x.value, 0);
    const ex = C ? C.rows.map(r => ({label: r[C.col], value: val(C, r[C.col])})).filter(x => x.value > 0).sort((a, b) => b.value - a.value) : [];
    html += `<div class="sec-head"><h2>Murid & kelas</h2></div><div class="grid2">
      <div class="card"><h3>Level murid aktif</h3>${R.bars(lv.map(x => ({...x, text: R.fmt(x.value,0), sub: tot ? R.fmtPct(x.value/tot*100,0) : ''})), {max: tot})}</div>
      ${C ? `<div class="card"><h3>Pengalaman trial · ${esc(month)}</h3>${ex.length ? R.bars(ex.map(x => ({...x, tone: /tidak senang|diam/i.test(x.label) ? 'r' : '', text: R.fmt(x.value,0)}))) : '<p class="note">Belum ada catatan.</p>'}
        <p class="note">Kalau "anak tidak senang" tinggi tapi CVR juga rendah di center yang sama, akar masalahnya di kualitas kelas/coach.</p></div>` : ''}
    </div>`;
  }
  return html;
}
})();
</script>
</body>
</html>
