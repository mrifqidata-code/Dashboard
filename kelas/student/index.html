<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Student</title>
<meta name="description" content="Cari murid dan lihat data dari Student Database & Student Management (dengan PIN).">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../assets/shell.css">
<link rel="stylesheet" href="../../assets/report.css">
</head>
<body class="cat-kelas">
<header class="top">
  <div class="wrap top-inner">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/><path d="M8 4v16M16 4v16"/></svg></div>
    <div class="brand">
      <h1>Student</h1>
      <p id="sub">Kelas</p>
    </div>
    <div class="right">
      <span class="sync" id="status">Memuat…</span>
      <button class="btn icon" id="pullBtn" type="button" aria-label="Tarik ulang data"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="cbar" id="cChips"></div>
  <div class="notice" id="errBox" hidden></div>
  <div id="view"><div class="skel"></div><div class="skel"></div></div>
  <div class="foot" id="foot"></div>
</main>

<script src="../../assets/shell.js"></script>
<script src="../../assets/report.js"></script>
<script>
(function(){
'use strict';
const R = DA.report, {esc} = DA;
const $ = s => document.querySelector(s);
DA.mountNav('kelas-student');
// Data murid tidak lewat feed publik: app bertanya ke web app Apps Script di Exboard (docs/student/Code.gs),
// yang hanya membalas bila PIN benar. Dikirim tanpa akun Google (credentials: omit), jadi tidak terpengaruh
// banyaknya akun Google yang login di HP.
const API = 'https://script.google.com/macros/s/AKfycbzHc-PlOTKY5QIqG78-P9EgC9dVjeC2qNW-gdSApZy9XK0mV-I9FTgnMv8pv0LdgUUjGQ/exec';
const PIN_KEY = 'dashboardApp.studentPin';
['#cChips', '#status', '#foot'].forEach(s => { const el = $(s); if (el) el.hidden = true; });
let pin = DA.lsGet(PIN_KEY) || '', timer = null, names = null;
// Daftar nama (tanpa data lain) disimpan hanya selama app terbuka (sessionStorage), supaya pencarian langsung di HP
const LIST_KEY = 'dashboardApp.studentList.v2';
const ssGet = () => { try { return JSON.parse(sessionStorage.getItem(LIST_KEY) || 'null'); } catch (e) { return null; } };
const ssSet = v => { try { v ? sessionStorage.setItem(LIST_KEY, JSON.stringify(v)) : sessionStorage.removeItem(LIST_KEY); } catch (e) {} };
const norm = s => String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim();
function useList(data){
  const S = data.sources.length;
  names = data.rows.map(r => ({n: r[0], c: r[1], k: norm(r[0]), hits: Object.fromEntries(data.sources.map((s, i) => [s, r[2 + i]]).filter(x => x[1])),
    st: r[2 + S] || '', cy: r[3 + S] || ''}));
  drawFilters();
}
// Sub-tab Status (Full / Regis Only, dari Student Database) dan Cycle (C1/C2/…, dari Student ID Student Management)
const ST_KEY = 'dashboardApp.studentStatus', CY_KEY = 'dashboardApp.studentCycle';
let fSt = 'ALL', fCy = 'ALL';
function drawFilters(){
  const sts = [...new Set(names.map(e => e.st).filter(Boolean))].sort((a, b) => (b==='Full') - (a==='Full') || a.localeCompare(b));
  const cys = [...new Set(names.map(e => e.cy).filter(Boolean))].sort((a, b) => Number(a.slice(1)) - Number(b.slice(1)));
  $('#fSt').hidden = !sts.length; $('#fCy').hidden = !cys.length;
  fSt = sts.length ? R.pickChips($('#fSt'), sts, ST_KEY, {all: 'Semua status', aria: 'Pilih status'}, () => { drawFilters(); runSearch(); }) : 'ALL';
  fCy = cys.length ? R.pickChips($('#fCy'), cys, CY_KEY, {all: 'Semua cycle', aria: 'Pilih cycle'}, () => { drawFilters(); runSearch(); }) : 'ALL';
}
const inFilter = e => (fSt === 'ALL' || e.st === fSt) && (fCy === 'ALL' || e.cy === fCy);
const filterLabel = () => [fSt === 'ALL' ? '' : fSt, fCy === 'ALL' ? '' : fCy].filter(Boolean).join(' · ');
async function loadList(){
  $('#hint').textContent = 'Memuat daftar nama…';
  const data = await api('list');
  ssSet(data); useList(data);
  runSearch();
}

async function api(action, body){
  let res;
  try { res = await fetch(API, {method: 'POST', credentials: 'omit', redirect: 'follow', body: JSON.stringify({action, pin, ...body})}); }
  catch (e) { throw new Error(navigator.onLine ? 'Tidak bisa menghubungi Apps Script.' : 'HP sedang offline.'); }
  let j; try { j = await res.json(); } catch (e) { throw new Error('Balasan Apps Script tidak terbaca. Pastikan deployment versi terbaru dengan akses "Anyone".'); }
  if (!j.ok) throw new Error(j.error || 'Gagal');
  return j.data;
}
const isPinErr = e => /PIN_SALAH/.test(String(e && e.message));

$('#view').innerHTML = `
  <form class="stu-pin card" id="pinBox" hidden>
    <h3>Masukkan PIN</h3>
    <p class="note" style="margin:0 0 12px">Data murid hanya tampil setelah PIN benar. PIN diingat di HP ini.</p>
    <input class="stu-input stu-pin-input" id="pin" type="password" inputmode="numeric" autocomplete="current-password" aria-label="PIN">
    <button class="btn stu-go" id="pinBtn" type="submit">Buka</button>
    <p class="note" id="pinMsg"></p>
  </form>
  <div id="app" hidden>
    <div class="stu-bar">
      <input class="stu-input" id="q" type="search" placeholder="Ketik nama anak…" autocomplete="off" aria-label="Cari nama anak">
      <button class="btn" id="lockBtn" type="button" title="Lupakan PIN di HP ini">Kunci</button>
    </div>
    <div class="cbar stu-f" id="fSt" hidden></div>
    <div class="cbar stu-f" id="fCy" hidden></div>
    <p class="note" id="hint">Ketik minimal 2 huruf, lalu pilih nama dari daftar.</p>
    <div class="stu-sugg" id="sugg"></div>
    <div id="out"></div>
  </div>`;
$('#pullBtn').hidden = true;

function askPin(msg){
  pin = ''; DA.lsSet(PIN_KEY, ''); ssSet(null); names = null;
  $('#app').hidden = true; $('#pinBox').hidden = false;
  $('#pinMsg').textContent = msg || ''; $('#pin').value = ''; $('#pin').focus();
}
function showApp(){ $('#pinBox').hidden = true; $('#app').hidden = false; }
function fail(e){
  if (isPinErr(e)) return askPin('PIN tidak cocok. Masukkan lagi.');
  $('#out').innerHTML = `<div class="notice">${esc(e.message)}</div>`;
}

$('#pinBox').addEventListener('submit', async ev => {
  ev.preventDefault();
  const v = $('#pin').value.trim(); if (!v) return;
  $('#pinBtn').disabled = true; $('#pinMsg').textContent = 'Memeriksa…';
  pin = v;
  try { await loadListAfterPin(); DA.lsSet(PIN_KEY, v); }
  catch (e) { pin = ''; $('#pinMsg').textContent = isPinErr(e) ? 'PIN tidak cocok.' : e.message; }
  finally { $('#pinBtn').disabled = false; }
});
$('#lockBtn').addEventListener('click', () => { $('#out').innerHTML = ''; $('#sugg').innerHTML = ''; $('#q').value = ''; askPin('Terkunci. Masukkan PIN untuk membuka lagi.'); });

async function loadListAfterPin(){ $('#pinMsg').textContent = 'Memuat daftar nama…'; await loadList(); showApp(); $('#q').focus(); }

// Pencarian di HP: semua kata yang diketik harus ada di nama; yang diawali kata pertama tampil lebih dulu
function runSearch(){
  const q = norm($('#q').value);
  if (!names) return;
  const base = names.filter(inFilter), lab = filterLabel();
  if (q.length < 2){ $('#sugg').innerHTML = ''; $('#hint').textContent = `${base.length.toLocaleString('id-ID')} murid${lab ? ' · ' + lab : ''}. Ketik minimal 2 huruf nama.`; return; }
  const words = q.split(' ');
  const hits = base.filter(e => words.every(w => e.k.includes(w)));
  hits.sort((a, b) => (b.k.startsWith(words[0]) - a.k.startsWith(words[0])) || a.n.localeCompare(b.n));
  const items = hits.slice(0, 15), more = hits.length - items.length;
  $('#hint').textContent = items.length ? `${hits.length} nama cocok${lab ? ' · ' + lab : ''}${more ? ' (perjelas ketikan untuk mempersempit)' : ''}.` : `Tidak ada nama yang cocok${lab ? ' untuk ' + lab : ''}.`;
  $('#sugg').innerHTML = items.map((e, i) => {
    const where = [e.st, e.cy].filter(Boolean).join(' · ') || Object.keys(e.hits).map(s => s.replace('Student ', '')).join(' · ');
    return `<button type="button" data-i="${i}"><span class="stu-nm">${esc(e.n)}</span>${e.c ? `<span class="chip">${esc(e.c)}</span>` : ''}<span class="stu-meta">${esc(where)}</span></button>`;
  }).join('');
  $('#sugg').onclick = ev => { const bt = ev.target.closest('button[data-i]'); if (bt) openStudent(items[Number(bt.dataset.i)]); };
}
$('#q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(runSearch, 80); });

async function openStudent(e){
  $('#sugg').innerHTML = ''; $('#hint').textContent = '';
  $('#out').innerHTML = `<div class="sec-head"><h2>${esc(e.n)}</h2></div><div class="skel"></div><div class="skel"></div>`;
  try {
    const parts = await api('detail', {name: e.n, center: e.c});
    $('#out').scrollIntoView({block: 'start'});
    let html = `<div class="sec-head"><h2>${esc(e.n)} ${e.c ? `<span class="chip">${esc(e.c)}</span>` : ''}</h2></div>`;
    parts.forEach(p => {
      html += `<div class="card stu-card"><h3>${esc(p.src)}${p.rows.length > 1 ? ` <span class="chip">${p.rows.length} baris</span>` : ''}</h3>`;
      if (p.missing) html += '<p class="note">Tab atau kolom nama tidak ditemukan.</p>';
      else if (!p.rows.length) html += '<p class="note">Tidak ada data dengan nama ini.</p>';
      p.rows.forEach((r, i) => {
        if (p.rows.length > 1) html += `<div class="stu-rowlab">Baris ${i + 1}</div>`;
        html += '<dl class="stu-dl">' + p.head.map((h, j) => (h && String(r[j]).trim()) ? `<dt>${esc(h)}</dt><dd>${esc(r[j])}</dd>` : '').join('') + '</dl>';
      });
      html += '</div>';
    });
    $('#out').innerHTML = html;
  } catch (err) { fail(err); }
}

// Daftar nama dari sesi ini dipakai langsung; selain itu diambil ulang (sekaligus mengecek PIN tersimpan)
const cached = pin && ssGet();
if (cached){ useList(cached); showApp(); runSearch(); }
else if (pin){ showApp(); loadList().catch(e => isPinErr(e) ? askPin('') : fail(e)); }
else askPin();
})();
</script>
</body>
</html>
