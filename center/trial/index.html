<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Class Trial</title>
<meta name="description" content="Booking, confirmed, show up dan paid kelas trial per center dan age group, untuk periode yang dipilih.">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../assets/shell.css">
<link rel="stylesheet" href="../../assets/report.css">
</head>
<body class="cat-center">
<header class="top">
  <div class="wrap top-inner">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></div>
    <div class="brand">
      <h1>Class Trial</h1>
      <p id="sub">Center</p>
    </div>
    <div class="right">
      <span class="sync" id="status">Memuat…</span>
      <button class="btn icon" id="pullBtn" type="button" aria-label="Tarik ulang data"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="cbar" id="cChips"></div>
  <div class="notice" id="errBox" hidden></div>
  <div id="view"><div class="skel"></div><div class="skel"></div></div>
  <div class="foot" id="foot"></div>
</main>

<script src="../../assets/shell.js"></script>
<script src="../../assets/report.js"></script>
<script>
(function(){
'use strict';
const R = DA.report, {esc} = DA;
const $ = s => document.querySelector(s);
DA.mountNav('center-trial');
const FEED = {id:'1rf4XebE5DbRaHBKwoOnyy9wdbEMrctLgc3VYjXrxezw', name:'Feed Class Trial (dari Exboard)', cache:'dashboardApp.trial.v1'};
const AGE_KEY = 'dashboardApp.trialAge', TIME_KEY = 'dashboardApp.trialTime', SRC_KEY = 'dashboardApp.trialSource';
const NET = 'Tanpa crosspol', CP = 'Crosspol saja';
if (DA.lsGet(SRC_KEY)==null) DA.lsSet(SRC_KEY, NET);   // bawaan: angka sudah dikurangi crosspol
const P = R.period('dashboardApp.trialRange', () => view.redraw());
$('#cChips').insertAdjacentHTML('afterend', '<div class="cbar" id="aChips"></div><div class="cbar" id="tChips" hidden></div><div class="cbar" id="sChips" hidden></div>');
let center = DA.center.get(), age = 'ALL', time = 'ALL', src = 'ALL';

// Feed: QUERY atas sheet Class Trial (per sesi) → satu baris per tanggal trial × center × age group × jam
function parse(text){
  const rows = DA.parseCSV(text), first = R.T((rows[0] || [])[0]);
  if (/^#REF/i.test(first)) return 'ref';
  const hi = rows.findIndex(r => /^tanggal$/i.test(R.T(r[0])) && /^center$/i.test(R.T(r[1])));
  if (hi < 0) return first.startsWith('#') ? `!<b>Rumus di feed error (${esc(first)}).</b> Buka feed-nya dan arahkan kursor ke sel A1 untuk melihat pesannya.` : '!<b>Isi feed tidak dikenali.</b> Baris judul (Tanggal, Center, Age Group, …) tidak ditemukan.';
  const head = rows[hi].map(h => R.T(h).toLowerCase()), col = n => head.indexOf(n);
  const ix = {a: col('age group'), t: col('jam'), bk: col('booking'), cf: col('confirmed'), su: col('show up'), dp: col('paid dp'), rf: col('regis full'), tp: col('total paid')};
  const out = [];
  for (const r of rows.slice(hi+1)){
    const d = R.toIso(r[0]); if (!d) continue;
    const c = R.T(r[1]).toUpperCase(); if (!DA.CENTERS.includes(c)) continue;
    const v = k => ix[k] >= 0 ? (R.num(r[ix[k]]) || 0) : 0;
    out.push({d, c, a: R.ageName(r[ix.a]), t: ix.t >= 0 ? R.toTime(r[ix.t]) : '', bk: v('bk'), cf: v('cf'), su: v('su'), dp: v('dp'), rf: v('rf'), tp: v('tp')});
  }
  return {ct: out, cp: parseCrosspol(rows)};
}

// Blok kedua feed (dari tab "Feed Crosspol" Exboard): kolom Kunci = "tanggal|center|age group|jam|status|show up|paid fee"
// dan Jumlah = banyaknya anak crosspol. Sumber: tab Crosspoll + Register Trial dengan Source Lead "Cross Poll".
function payOf(s){
  s = R.T(s).toLowerCase().replace(/^regist\b/, 'regis').replace(/regis fee \+ member/, 'regis + member');
  return s==='regis fee only' ? 'dp' : (s==='regis + member fee' || s==='member fee') ? 'full' : 'none';
}
function parseCrosspol(rows){
  let hi = -1, kc = -1;
  for (let i = 0; i < Math.min(rows.length, 5) && kc < 0; i++){ kc = (rows[i] || []).findIndex(h => /^kunci$/i.test(R.T(h))); hi = i; }
  if (kc < 0) return null;
  const out = [];
  for (const r of rows.slice(hi+1)){
    const k = R.T(r[kc]), n = R.num(r[kc+1]) || 0; if (!k || !n) continue;
    const [d0, c0, a0, t0, st, su0, pf] = k.split('|');
    const d = R.toIso(d0), c = R.T(c0).toUpperCase(); if (!d || !DA.CENTERS.includes(c)) continue;
    const pay = payOf(pf), su = /^true$/i.test(R.T(su0));
    out.push({d, c, a: R.ageName(a0), t: R.toTime(t0), st: R.T(st), bk: n, cf: /confirm/i.test(st || '') ? n : 0, su: su ? n : 0,
      dp: pay==='dp' ? n : 0, rf: pay==='full' ? n : 0, tp: pay==='none' ? 0 : n});
  }
  return out;
}
// Sumber angka: Class Trial dikurangi crosspol (bawaan), crosspol saja, atau Class Trial apa adanya
const neg = x => ({...x, bk: -x.bk, cf: -x.cf, su: -x.su, dp: -x.dp, rf: -x.rf, tp: -x.tp});
function pick(data){
  if (!data.cp) return data.ct;
  if (src===CP) return data.cp;
  if (src===NET) return data.ct.concat(data.cp.map(neg));
  return data.ct;
}

const KEYS = ['bk','cf','su','dp','rf','tp'];
const sum = list => { const t = {bk:0, cf:0, su:0, dp:0, rf:0, tp:0}; list.forEach(x => KEYS.forEach(k => t[k] += x[k])); return t; };
const pct = (a, b) => b ? a / b * 100 : null;
const cvrTone = v => v==null ? '' : v >= 45 ? 'g' : v < 35 ? 'r' : 'y';
const HEAD = ['Booking','Confirmed','Show up','Paid DP','Regis Full','Total paid','Show up rate','CVR'];
const cells = t => [R.fmt(t.bk,0), R.fmt(t.cf,0), R.fmt(t.su,0), R.fmt(t.dp,0), R.fmt(t.rf,0), R.fmt(t.tp,0), R.fmtPct(pct(t.su, t.bk)), R.fmtPct(pct(t.tp, t.su))];
const tones = t => ['','','','','','','', cvrTone(pct(t.tp, t.su))];   // warna hanya di kolom CVR
const line = (label, t, cls) => ({cls: cls || '', cells: [label].concat(cells(t)), tones: [''].concat(tones(t))});

const view = R.start({feed: FEED, parse, render, foot: 'Tanggal = tanggal kelas trial (Trial Date di sheet Class Trial). Age group: Baby 6–17 bln, Tiny 18–36 bln, Little 3–5 th, Kids 5–8+ th, Star 9–12 th. Paid DP = # Regis, Regis Full = # Regis + Full. Show up rate = show up ÷ booking, CVR = total paid ÷ show up. Tanpa crosspol = angka Class Trial dikurangi anak crosspol (tab Crosspoll + Register Trial dengan Source Lead Cross Poll) pada tanggal, center, age group dan jam yang sama.'});

function render(data){
  center = DA.centerChips($('#cChips'), DA.CENTERS, c => { center = c; view.redraw(); });
  $('#sChips').hidden = !data.cp;
  src = data.cp ? R.pickChips($('#sChips'), [NET, CP], SRC_KEY, {all:'Semua sumber', aria:'Pilih sumber lead'}, () => view.redraw()) : 'ALL';
  const all = pick(data);
  const ages = [...new Set(all.map(x => x.a))].sort(R.ageSort);
  age = R.ageChips($('#aChips'), ages, AGE_KEY, () => view.redraw());
  // Jam sesi; baris chip hanya muncul bila feed sudah punya kolom Jam
  // Hanya jam yang pernah dipakai center terpilih, supaya pilihannya tidak terlalu panjang
  const times = [...new Set(all.filter(x => center==='ALL' || x.c===center).map(x => x.t).filter(Boolean))].sort(R.timeSort);
  $('#tChips').hidden = !times.length;
  time = times.length ? R.pickChips($('#tChips'), times, TIME_KEY, {all:'Semua jam', aria:'Pilih jam'}, () => view.redraw()) : 'ALL';
  const fC = x => center==='ALL' || x.c===center, fA = x => age==='ALL' || x.a===age, fT = x => time==='ALL' || x.t===time;

  const dates = all.map(x => x.d).sort();
  P.bounds(dates);
  const inRange = all.filter(x => x.d >= P.from && x.d <= P.to);
  const inScope = inRange.filter(x => fC(x) && fA(x) && fT(x));
  const scopeLabel = [center==='ALL' ? 'Semua center' : center, age==='ALL' ? '' : age, time==='ALL' ? '' : 'jam ' + time, data.cp && src===NET ? 'tanpa crosspol' : data.cp && src===CP ? 'crosspol' : ''].filter(Boolean).join(' · ');
  $('#sub').textContent = `${P.label()} · ${scopeLabel}`;
  if (!inScope.length){
    const span = dates.length ? ` Data tersedia ${R.niceDate(dates[0])} – ${R.niceDate(dates[dates.length-1])}.` : '';
    return R.empty('Belum ada trial di periode ini', `Tidak ada sesi trial ${esc(scopeLabel.toLowerCase())} pada ${esc(P.label())}.${span}`);
  }
  const t = sum(inScope), cvr = pct(t.tp, t.su);
  let html = `<div class="kpis kpis3">
    ${R.kpi('Booking', R.fmt(t.bk,0), esc(scopeLabel))}
    ${R.kpi('Confirmed', R.fmt(t.cf,0), `${R.fmtPct(pct(t.cf, t.bk),0)} dari booking`)}
    ${R.kpi('Show up', R.fmt(t.su,0), `${R.fmtPct(pct(t.su, t.bk),0)} dari booking`)}
    ${R.kpi('Paid DP', R.fmt(t.dp,0), `${R.fmtPct(pct(t.dp, t.tp),0)} dari total paid`)}
    ${R.kpi('Regis Full', R.fmt(t.rf,0), `${R.fmtPct(pct(t.rf, t.tp),0)} dari total paid`)}
    ${R.kpi('Total paid', R.fmt(t.tp,0), `CVR ${R.fmtPct(cvr)} dari show up`, cvrTone(cvr))}
  </div>`;
  html += `<div class="card" style="margin-top:12px"><h3>Funnel trial</h3>${R.bars([
    {label:'Booking', value:t.bk}, {label:'Confirmed', value:t.cf}, {label:'Show up', value:t.su},
    {label:'Total paid', value:t.tp, tone:'g'}, {label:'↳ Paid DP', value:t.dp, tone:'y'}, {label:'↳ Regis Full', value:t.rf, tone:'g'}]
    .map(x => ({...x, text: R.fmt(x.value,0), sub: R.fmtPct(pct(x.value, t.bk),0)})), {max: t.bk || 1})}
    <p class="note">Persen = terhadap booking. CVR hijau ≥45%, merah &lt;35%.</p></div>`;

  if (center==='ALL'){
    const base = inRange.filter(x => fA(x) && fT(x)), sub = [age==='ALL' ? '' : age, time==='ALL' ? '' : 'jam ' + time].filter(Boolean).join(' · ');
    html += `<div class="sec-head"><h2>Per center</h2>${sub ? `<span class="note" style="margin:0">${esc(sub)}</span>` : ''}</div>` +
      R.tbl(['Center'].concat(HEAD), DA.CENTERS.map(c => line(c, sum(base.filter(x => x.c===c)))).concat([line('TOTAL', sum(base), 'tot')]));
  }
  if (age==='ALL'){
    const base = inRange.filter(x => fC(x) && fT(x));
    html += `<div class="sec-head"><h2>Per age group</h2><span class="note" style="margin:0">${esc([center==='ALL' ? 'Semua center' : center, time==='ALL' ? '' : 'jam ' + time].filter(Boolean).join(' · '))}</span></div>` +
      R.tbl(['Age group'].concat(HEAD), ages.map(a => line(esc(a), sum(base.filter(x => x.a===a)))).filter(r => r.cells[1] !== '0' || r.cells[3] !== '0').concat([line('TOTAL', sum(base), 'tot')]));
    if (center==='ALL'){
      // Matriks center × age group untuk satu angka: total paid (show up di bawahnya)
      html += `<div class="sec-head"><h2>Center × age group</h2><span class="note" style="margin:0">paid / show up</span></div>` +
        R.tbl(['Center'].concat(ages, ['Total']), DA.CENTERS.concat(['TOTAL']).map(c => {
          const rowsC = c==='TOTAL' ? base : base.filter(x => x.c===c);
          const cell = l => { const s = sum(l); return s.su || s.tp ? `${R.fmt(s.tp,0)}<small class="muted"> / ${R.fmt(s.su,0)}</small>` : '–'; };
          return {cls: c==='TOTAL' ? 'tot' : '', cells: [c].concat(ages.map(a => cell(rowsC.filter(x => x.a===a))), [cell(rowsC)])};
        }));
    }
  }

  if (time==='ALL' && times.length){
    const base = inRange.filter(x => fC(x) && fA(x));
    html += `<div class="sec-head"><h2>Per jam</h2><span class="note" style="margin:0">${esc([center==='ALL' ? 'Semua center' : center, age==='ALL' ? '' : age].filter(Boolean).join(' · '))}</span></div>` +
      R.tbl(['Jam'].concat(HEAD), times.map(h => line(esc(h), sum(base.filter(x => x.t===h)))).filter(r => r.cells[1] !== '0' || r.cells[3] !== '0').concat([line('TOTAL', sum(base), 'tot')]));
  }

  // Rincian waktu: per hari bila ≤ 31 hari, selain itu per bulan
  const byMonth = P.days() > 31, keyOf = x => byMonth ? x.d.slice(0,7) : x.d;
  const keys = [...new Set(inScope.map(keyOf))].sort().reverse();
  const lab = byMonth ? R.monthLabel : R.dayLabel;
  html += `<div class="sec-head"><h2>${byMonth ? 'Per bulan' : 'Per hari'}</h2><span class="note" style="margin:0">${esc(scopeLabel)}</span></div>` +
    R.tbl([byMonth ? 'Bulan' : 'Tanggal'].concat(HEAD), keys.map(k => line(lab(k), sum(inScope.filter(x => keyOf(x)===k)))).concat([line('TOTAL', t, 'tot')]));
  if (P.to > P.today) html += '<p class="note">Tanggal setelah hari ini berisi booking untuk jadwal trial yang akan datang.</p>';
  return html;
}
})();
</script>
</body>
</html>
