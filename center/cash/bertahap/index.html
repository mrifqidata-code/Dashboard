<body class="cat-center">

  <div class="foot" id="foot"></div>
</main>

<script src="../../../assets/shell.js"></script>
<script src="../../../assets/report.js"></script>
<script>
(function(){
'use strict';
const R = DA.report, {esc} = DA;
const $ = s => document.querySelector(s);
DA.mountNav('center-cash-cb');
let center = DA.center.get();
const FEED = {id:'18YbQv-ku6crYGdIFQBLronFrbqFOg0VQcH_mWE6tMMM', name:'Feed Cash Bertahap v3 (dari Exboard)', cache:'dashboardApp.cb.v3'};

const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
// Status cicilan dari aman ke berisiko; st = nama status di CB Tracker (untuk rentang hari dari tabel C)
const STEPS = [
  {k:'Lunas', label:'Lunas', tone:'g', color:'var(--good)'},
  {k:'On track', st:'ON TRACK', label:'On track', tone:'', color:'var(--accent)'},
  {k:'Telat', st:'TELAT', label:'Telat', tone:'y', color:'var(--warn)'},
  {k:'Warning', st:'WARNING', label:'Warning', tone:'s', color:'var(--serious)'},
  {k:'Default', st:'DEFAULT', label:'Default', tone:'r', color:'var(--crit)'},
  {k:'Lainnya', label:'Belum ada tagihan', tone:'n', color:'var(--muted)'}
];
const pad2 = n => String(n).padStart(2, '0');
const add3 = (...v) => v.reduce((t, x) => t + (x || 0), 0);
// Nilai di sebelah label, mis. "Bayar terakhir paling baru:"
function after(sec, re){ for (const r of sec || []) { const i = r.findIndex(x => re.test(x || '')); if (i >= 0) return r[i+1] || ''; } return ''; }
// Tabel per tanggal (D, E): jumlah kolom `col` untuk tanggal from..to (yyyy-mm-dd, inklusif; null = tanpa batas)
function sumDates(t, col, from, to){
  if (!t || t.idx(col) < 0) return null;
  let s = 0;
  t.rows.forEach(r => { const d = R.toIso(r[t.col]); if (d && (!from || d >= from) && (!to || d <= to)) s += R.num(t.get(r, col)) || 0; });
  return s;
}

function render(secs){
  center = DA.centerChips($('#cChips'), DA.CENTERS, c => { center = c; view.redraw(); drawList(); });
  const cb = secs['CB Tracker'], six = secs['16 Cash Bertahap'];
  const A = R.table(cb, /^A\. STATUS CICILAN/i), B = R.table(cb, /^B\. NILAI/i), C = R.table(cb, /^C\. HARI SEJAK BAYAR/i),
        D = R.table(cb, /^D\. JATUH TEMPO/i), E = R.table(cb, /^E\. BAYAR TERAKHIR/i), S = R.table(six, /^A\. STATUS CASH BERTAHAP/i);
  if (!A) return R.empty('Tabel cash bertahap belum terbaca', 'Bagian "A. Status cicilan" tidak ditemukan di Feed Cash Bertahap.');
  const c = center, key = c==='ALL' ? 'TOTAL' : c, scope = c==='ALL' ? 'semua center' : c;
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), today = R.isoDate(now);
  const day = (yy, mm, dd) => R.isoDate(new Date(yy, mm, dd));
  const som = day(y, m, 1), eom = day(y, m+1, 0), nsom = day(y, m+1, 1), neom = day(y, m+2, 0), psom = day(y, m-1, 1), peom = day(y, m, 0);
  const month = `${BULAN[m]} ${y}`;
  const dataDate = R.toIso(after(cb, /^Bayar terakhir paling baru/i));
  $('#sub').textContent = `Cicilan ${month}${dataDate ? ' · data s.d. ' + R.niceDate(dataDate) : ''}${c==='ALL' ? '' : ' · ' + c}`;

  const a = (k, x) => A.val(k, x || c), b = (k, x) => B ? B.val(k, x || c) : null;
  // Cicilan bulan berjalan untuk satu center (ALL = TOTAL), dari tabel per tanggal D dan E
  const month0 = x => { const k = x==='ALL' ? 'TOTAL' : x; return {
    due: sumDates(D, k, som, eom), late: sumDates(D, k, som, R.addDays(today, -1)), over: sumDates(D, k, null, peom),
    next: sumDates(D, k, nsom, neom), dueRp: sumDates(D, 'Rp ' + k, som, eom), overRp: sumDates(D, 'Rp ' + k, null, peom),
    paid: sumDates(E, k, som, eom), paidLunas: sumDates(E, 'Lunas ' + k, som, eom), paidPrev: sumDates(E, k, psom, peom)}; };
  const M = month0(c);
  const total = a('Total murid'), aktif = a('Masih berjalan'), sisa = b('Sisa tagihan (masih berjalan)');
  const overShare = aktif && M.over!=null ? M.over / aktif * 100 : null;
  let html = `<div class="kpis">
    ${R.kpi('Jatuh tempo bulan ini', R.fmt(M.due,0), M.due==null ? '' : `murid belum bayar · ${R.fmt(M.late,0)} sudah lewat tanggalnya`)}
    ${R.kpi('Tunggakan', R.fmt(M.over,0), `jatuh tempo sebelum ${esc(BULAN[m])} · sisa ${R.fmtRp(M.overRp)}`, overShare==null ? '' : overShare > 30 ? 'r' : overShare > 15 ? 'y' : 'g')}
    ${R.kpi('Sudah bayar bulan ini', R.fmt(M.paid,0), M.paid==null ? '' : `murid · ${R.fmt(M.paidLunas,0)} di antaranya lunas`)}
    ${R.kpi('Sisa tagihan', R.fmtRp(sisa), `${R.fmt(aktif,0)} murid masih berjalan`)}
  </div>`;

  // ---- Cicilan bulan berjalan ----
  html += `<div class="sec-head"><h2>Cicilan ${esc(month)} · ${esc(scope)}</h2></div>`;
  if (c==='ALL'){
    const cols = DA.CENTERS.concat(['ALL']);
    html += `<div class="tbl-fit">${R.tbl(['Center','Jatuh tempo','Sudah lewat','Tunggakan','Sudah bayar'], cols.map(x => { const v = month0(x); return {
      cls: x==='ALL' ? 'tot' : '', tones: ['', '', v.late ? 'y' : '', v.over ? 'r' : '', 'g'],
      cells: [x==='ALL' ? 'TOTAL' : x, R.fmt(v.due,0), R.fmt(v.late,0), R.fmt(v.over,0), R.fmt(v.paid,0)]}; }))}</div>`
      + `<p class="note">Jumlah murid. Jatuh tempo = belum bayar dan jatuh temponya bulan ini; sudah lewat = bagian dari jatuh tempo yang tanggalnya sebelum hari ini. Tunggakan = jatuh temponya sebelum bulan ini dan belum bayar lagi. Sudah bayar = bayar terakhirnya bulan ini.</p>`;
  }
  const weeks = [[1,7],[8,14],[15,21],[22,0]].map(([d1, d2]) => {
    const from = som.slice(0,8) + pad2(d1), to = d2 ? som.slice(0,8) + pad2(d2) : eom;
    return {label: `Tgl ${d1}–${Number(to.slice(8))}`, value: sumDates(D, key, from, to), rp: sumDates(D, 'Rp ' + key, from, to), past: to < today};
  });
  html += `<div class="grid2"${c==='ALL' ? ' style="margin-top:12px"' : ''}>
    <div class="card"><h3>Bulan ini</h3>${R.bars([
      {label:'Jatuh tempo', value: M.due, tone:'y'},
      {label:'Lewat tanggal', value: M.late, tone:'r'},
      {label:'Tunggakan', value: M.over, tone:'r'},
      {label:'Sudah bayar', value: M.paid, tone:'g'},
      {label:'Bulan depan', value: M.next, tone:'n'}].map(x => ({...x, text: R.fmt(x.value,0)})))}
      <p class="note">Sudah bayar bulan lalu: ${R.fmt(M.paidPrev,0)} murid. Sisa tagihan murid yang jatuh tempo bulan ini ${R.fmtRp(M.dueRp)}.</p></div>
    <div class="card"><h3>Jatuh tempo per pekan</h3>${R.bars(weeks.map(w => ({label: w.label, value: w.value, tone: w.past ? 'r' : 'y', text: R.fmt(w.value,0), sub: R.fmtRp(w.rp)})))}
      <p class="note">Murid yang belum bayar, menurut tanggal jatuh temponya. Nominal = sisa tagihan murid tersebut, bukan besar cicilannya. Merah = tanggalnya sudah lewat.</p></div>
  </div>`;

  // ---- Status seluruh periode ----
  const rng = st => {
    const r = C && C.row(st); if (!r) return '';
    const lo = R.num(C.get(r, 'Min hari')), hi = R.num(C.get(r, 'Max hari'));
    if (lo==null || hi==null) return '';
    return st==='ON TRACK' ? `≤${hi} hari` : st==='DEFAULT' ? `>${lo-1} hari` : `${lo}–${hi} hari`;
  };
  const steps = STEPS.map(s => ({...s, value: a(s.k) || 0, range: s.st ? rng(s.st) : ''}));
  const tol = a('Lunas karena selisih < 300rb'), disc = b('Selisih dianggap diskon (< 300rb)');
  const ranges = steps.filter(x => x.range).map(x => `${x.label.toLowerCase()} ${x.range}`).join(', ');
  html += `<div class="sec-head"><h2>Status cicilan · seluruh periode</h2><span class="note" style="margin:0">${R.fmt(total,0)} murid</span></div>
    <div class="grid2"><div class="card"><div class="stack">${steps.map(x => `<i style="width:${total ? x.value/total*100 : 0}%;background:${x.color}" title="${esc(x.label)}: ${R.fmt(x.value,0)}"></i>`).join('')}</div>
      <div style="margin-top:12px">${R.bars(steps.map(x => ({label: x.label, value: x.value, tone: x.tone, text: R.fmt(x.value,0), sub: total ? R.fmtPct(x.value/total*100,0) : ''})), {max: total})}</div>
      ${ranges ? `<p class="note">Hari sejak bayar terakhir: ${esc(ranges)}.</p>` : ''}
      ${tol ? `<p class="note">Lunas termasuk ${R.fmt(tol,0)} murid yang kurang bayar di bawah Rp 300.000 (dianggap diskon, total ${R.fmtRp(disc)}).</p>` : ''}</div>
    <div class="card"><h3>Nilai</h3>${R.bars([
      {label:'Total tagihan', value: b('Total tagihan')},
      {label:'Sudah dibayar', value: b('Sudah dibayar'), tone:'g'},
      {label:'Sisa tagihan', value: sisa, tone:'y'},
      {label:'Sisa berisiko', value: b('Sisa tagihan berisiko (telat + warning + default)'), tone:'r'}].map(x => ({...x, text: R.fmtRp(x.value)})))}
      <p class="note">Sisa tagihan = kekurangan murid yang masih berjalan. Sisa berisiko = bagian dari sisa tagihan milik murid telat, warning, atau default.</p></div></div>`;

  // ---- Dibanding tab 16 Cash Bertahap ----
  if (S){
    const s = re => S.val(re, c), add = (p, q) => p==null && q==null ? null : (p || 0) + (q || 0);
    const rows = [
      ['Total murid', total, s(/^Total murid/i)],
      ['Lunas', a('Lunas'), s(/^LUNAS$/i)],
      ['Masih berjalan', aktif, s(/^Masih berjalan/i)],
      ['On track', a('On track'), s(/^ON TRACK/i)],
      ['Telat (31–60 hari)', add(a('Telat'), a('Warning')), s(/^TELAT/i)],
      ['Lebih dari 60 hari', a('Default'), s(/^WARNING/i)]].map(r => ({cells: [esc(r[0]), R.fmt(r[1],0), R.fmt(r[2],0)]}));
    const rp = [
      ['Sisa tagihan', sisa, s(/^Sisa tagihan belum lunas/i)],
      ['Sisa berisiko', b('Sisa tagihan berisiko (telat + warning + default)'), s(/^Sisa tagihan BERISIKO/i)]].map(r => ({cells: [esc(r[0]), R.fmtRp(r[1]), R.fmtRp(r[2])]}));
    html += `<div class="sec-head"><h2>Dibanding tab 16 Cash Bertahap</h2></div><div class="tbl-fit">${R.tbl(['', 'CB Tracker', '16 Cash Bertahap'], rows.concat(rp))}</div>`
      + `<p class="note">16 Cash Bertahap menganggap lunas bila sudah ada transaksi Pelunasan; telat = 31–60 hari dan warning / gagal bayar = lebih dari 60 hari sejak bayar terakhir. CB Tracker membandingkan total bayar dengan total tagihan (di sini kurang bayar di bawah Rp 300.000 ikut lunas)${ranges ? `; statusnya: ${esc(ranges)}` : ''}.</p>`;
  }

  // ---- Per center ----
  if (c==='ALL'){
    const cols = DA.CENTERS.concat(['ALL']);
    html += `<div class="sec-head"><h2>Per center · seluruh periode</h2></div><div class="tbl-fit">` + R.tbl(['Center','Murid','Berjalan','Bermasalah','Sisa tagihan'], cols.map(x => {
      const tot = a('Total murid', x), bad = add3(a('Telat', x), a('Warning', x), a('Default', x)), pct = tot ? bad / tot * 100 : null;
      return {cls: x==='ALL' ? 'tot' : '', tones: ['', '', '', pct==null ? '' : pct > 30 ? 'r' : pct > 15 ? 'y' : 'g', ''],
        cells: [x==='ALL' ? 'TOTAL' : x, R.fmt(tot,0), R.fmt(a('Masih berjalan', x),0), R.fmtPct(pct), R.fmtRp(b('Sisa tagihan (masih berjalan)', x))]};
    })) + `</div><p class="note">Berjalan = belum lunas. Bermasalah = telat + warning + default, dibagi total murid cash bertahap center itu.</p>`;
  }
  return html;
}
// ---- Daftar murid perlu ditagih ----
// Nama murid tidak lewat feed publik: diambil dari Apps Script ber-PIN (aksi 'cb', PIN sama dengan halaman Student),
// hanya disimpan di memori selama halaman terbuka. Server sudah membuang yang lunas (termasuk kurang bayar < Rp 300.000).
const LIST_KEY = 'dashboardApp.cbListFilter', AMT_KEY = 'dashboardApp.cbListAmount', SM_KEY = 'dashboardApp.cbListActive', STEP = 50;
// Sisa tagihan kecil sering berupa diskon yang di-approve, jadi bisa disaring: hanya sisa di atas MIN_SISA
const MIN_SISA = 1000000, AMOUNTS = [['ALL', 'Semua', () => true], ['big', 'Sisa tagihan di atas 1 juta', x => (x.sisa || 0) > MIN_SISA]];
// Murid default seharusnya Inactive di Student Management; yang masih Active perlu ditangani
const isActiveDefault = x => x.st === 'DEFAULT' && /^active$/i.test(x.sm || '');
const ACTIVES = [['ALL', 'Semua', () => true], ['act', 'Default tapi masih Active', isActiveDefault]];
const ST_LABEL = {'ON TRACK': 'On track', TELAT: 'Telat', WARNING: 'Warning', DEFAULT: 'Default', 'TAGIHAN BELUM ADA': 'Belum ada tagihan', 'BELUM ADA DATA': 'Belum ada data'};
const L = {state: 'idle', data: null, err: '', show: STEP, f: DA.lsGet(LIST_KEY) || 'ALL', amt: DA.lsGet(AMT_KEY) || 'ALL', act: DA.lsGet(SM_KEY) || 'ALL'};
let pin = DA.lsGet(DA.PIN_KEY) || '';
$('#view').insertAdjacentHTML('afterend', '<section id="cbx" aria-label="Daftar murid perlu ditagih"></section>');

function today0(){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  return {y, today: R.isoDate(now), som: R.isoDate(new Date(y, m, 1)), eom: R.isoDate(new Date(y, m+1, 0))};
}
// Sesi package: 3 bulan = 12, 6 bulan = 24, 12 bulan = 48 (4 sesi per bulan). Harga per sesi = total tagihan ÷ sesi package;
// eligible = sudah dibayar ÷ harga per sesi, dibulatkan ke bawah. Lolos = sesi terpakai melewati eligible;
// warning = sisa eligible tinggal WARN_SISA sesi atau kurang.
const PKG_SESI = {3: 12, 6: 24, 12: 48}, WARN_SISA = 2;
function sesi(x){
  const m = /(\d+)\s*(month|bulan|bln)/i.exec(x.pkg || ''), months = m ? Number(m[1]) : 0;
  const total = months ? PKG_SESI[months] || months * 4 : null, ok = total && x.bill > 0;
  const elig = ok ? Math.min(total, Math.floor(x.paid * total / x.bill + 1e-9)) : null;
  const st = elig == null || x.used == null ? '' : x.used > elig ? 'lolos' : elig - x.used <= WARN_SISA ? 'warning' : 'aman';
  return {total, per: ok ? x.bill / total : null, elig, st};
}
const isLate = x => x.st === 'TELAT' || x.st === 'WARNING' || x.st === 'DEFAULT';
// Yang tampil: telat / warning / default, jatuh tempo paling lambat akhir bulan ini, atau sesinya lolos / warning
const needed = (x, t) => isLate(x) || (!!x.due && x.due <= t.eom) || x.ses.st === 'lolos' || x.ses.st === 'warning';
// Pilihan status daftar; boleh tumpang-tindih (murid default biasanya juga tunggakan)
const listFilters = t => [
  ['ALL', 'Semua', () => true],
  ['due', 'Jatuh tempo bulan ini', x => x.due >= t.som && x.due <= t.eom],
  ['over', 'Tunggakan', x => !!x.due && x.due < t.som],
  ['TELAT', 'Telat', x => x.st === 'TELAT'],
  ['WARNING', 'Warning', x => x.st === 'WARNING'],
  ['DEFAULT', 'Default', x => x.st === 'DEFAULT'],
  ['lolos', 'Sesi lolos', x => x.ses.st === 'lolos'],
  ['swarn', 'Sesi warning', x => x.ses.st === 'warning']];
const shortDate = (s, y) => { if (!s) return '—'; const [yy, mm, dd] = s.split('-').map(Number); return `${dd} ${R.MON[mm-1]}${yy !== y ? ' ' + yy : ''}`; };

// Kolom CB Tracker yang dipakai, dicari lewat judulnya (Apps Script mengirim semua kolom beserta judul)
const COLS = {n: /^nama/, c: /^center/, st: /^status$/, last: /^bayar terakhir/, days: /^hari sejak bayar/, due: /^jatuh tempo/,
  paid: /^total dibayar/, bill: /^total tagihan/, pkg: /^package$/, sd: /^status student database/, sm: /^status student management/,
  id: /^sparks id/, used: /^sesi terpakai/};
// Apps Script versi sebelumnya mengirim kolom pilihan dengan nama tetap
const OLD_COLS = {n: 'nama', c: 'center', st: 'status', last: 'bayarTerakhir', days: 'hari', due: 'jatuhTempo', paid: 'dibayar', bill: 'tagihan',
  pkg: 'package', sd: 'statusSD', id: 'id', used: 'terpakai'};
const numOrNull = v => typeof v === 'number' && isFinite(v) ? v : null;
// Tanggal: teks yyyy-mm-dd, atau nomor seri Sheets bila sel bukan berformat tanggal
const ymd = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v) ? v.slice(0, 10) : typeof v === 'number' && v > 30000 ? new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10) : '';
function useList(d){
  let ix;
  if (d.head){ const hn = d.head.map(h => String(h).replace(/[*]/g, '').replace(/\s+/g, ' ').trim().toLowerCase());
    ix = Object.fromEntries(Object.entries(COLS).map(([k, re]) => [k, hn.findIndex(h => re.test(h))])); }
  else ix = Object.fromEntries(Object.entries(OLD_COLS).map(([k, name]) => [k, d.cols.indexOf(name)]));
  const get = (r, k) => ix[k] >= 0 ? r[ix[k]] : null, key = x => x.due || '9999';
  // Kolom yang belum terbaca (Apps Script versi lama, atau judulnya tidak ada di baris 7 CB Tracker)
  const missing = [['used', 'Sesi Terpakai'], ['sm', 'Status Student Management']].filter(([k]) => !(ix[k] >= 0)).map(([, lab]) => lab);
  L.data = {at: d.at, missing, rows: d.rows.map(r => {
    const x = {n: String(get(r, 'n') || ''), c: String(get(r, 'c') || '').toUpperCase(), st: String(get(r, 'st') || '').toUpperCase(),
      last: ymd(get(r, 'last')), days: numOrNull(get(r, 'days')), due: ymd(get(r, 'due')), paid: numOrNull(get(r, 'paid')) || 0,
      bill: numOrNull(get(r, 'bill')), pkg: String(get(r, 'pkg') || ''), sd: String(get(r, 'sd') || ''), sm: String(get(r, 'sm') || ''),
      id: String(get(r, 'id') || ''), used: numOrNull(get(r, 'used'))};
    x.sisa = x.bill > 0 ? x.bill - x.paid : null; x.ses = sesi(x);
    return x;
  }).sort((a, b) => key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : a.n.localeCompare(b.n))};
  L.state = 'ok';
}
async function loadList(fresh){
  if (!pin){ L.state = 'pin'; return drawList(); }
  L.state = 'loading'; L.err = ''; drawList();
  try { useList(await DA.privateApi('cb', pin, fresh ? {fresh: true} : {})); DA.lsSet(DA.PIN_KEY, pin); }
  catch (e){
    if (DA.isPinErr(e)){ pin = ''; DA.lsSet(DA.PIN_KEY, ''); L.state = 'pin'; L.err = 'PIN tidak cocok. Masukkan lagi.'; }
    else { L.state = 'err'; L.err = /Aksi tidak dikenal/.test(e.message)
      ? 'Apps Script di Exboard belum diperbarui untuk daftar ini. Tempel Code.gs terbaru, lalu Deploy → Manage deployments → edit → Version: New version.' : e.message; }
  }
  drawList();
}
function itemHtml(x, t){
  const tone = x.st === 'DEFAULT' ? 'r' : x.st === 'TELAT' || x.st === 'WARNING' ? 'y' : '';
  const pct = x.bill ? Math.round(x.paid / x.bill * 100) : null, s = x.ses, sTone = s.st === 'lolos' ? 'r' : s.st === 'warning' ? 'y' : '';
  const extra = [s.per ? `${R.fmtRp(s.per)} per sesi` : '', x.sd ? 'Student Database: ' + x.sd : '', x.sm ? 'Student Management: ' + x.sm : '', x.id].filter(Boolean).join(' · ');
  return `<div class="item ${tone}">
    <div class="item-top"><span class="item-name">${esc(x.n)}</span><span class="item-st"><span class="item-sub"><span class="chip">${esc(x.c)}</span><span class="chip ${tone}">${esc(ST_LABEL[x.st] || x.st || '—')}</span></span>${sTone ? `<span class="chip ${sTone}">Sesi ${s.st}</span>` : ''}${isActiveDefault(x) ? '<span class="chip r" title="Default tapi status Student Management masih Active">Active</span>' : ''}</span></div>
    <div class="mets">
      <div class="met"><div class="ml">Bayar terakhir</div><div class="mv">${shortDate(x.last, t.y)}${x.days!=null ? ` <small>${R.fmt(x.days,0)} hari</small>` : ''}</div></div>
      <div class="met"><div class="ml">Jatuh tempo</div><div class="mv${x.due && x.due < t.today ? ' late' : ''}">${shortDate(x.due, t.y)}</div></div>
      <div class="met"><div class="ml">Sisa tagihan</div><div class="mv">${R.fmtRp(x.sisa)}</div></div>
      <div class="met"><div class="ml">Sudah dibayar</div><div class="mv">${R.fmtRp(x.paid)}${pct!=null ? ` <small>${pct}%</small>` : ''}</div></div>
      <div class="met"><div class="ml">Package</div><div class="mv long">${esc(x.pkg || '—')}${s.total ? ` <small>${s.total} sesi</small>` : ''}</div></div>
      <div class="met"><div class="ml">Terpakai / eligible</div><div class="mv${sTone==='r' ? ' late' : sTone==='y' ? ' warn' : ''}">${x.used==null ? '—' : R.fmt(x.used,0)} / ${s.elig==null ? '—' : R.fmt(s.elig,0)} <small>sesi</small></div></div>
    </div>${extra ? `<p class="note">${esc(extra)}</p>` : ''}</div>`;
}
function drawList(){
  const el = $('#cbx'); if (!el) return;
  const t = today0();
  let h = `<div class="sec-head"><h2>Daftar murid perlu ditagih</h2>${L.state==='ok' ? `<button class="btn" type="button" data-lock title="Sembunyikan nama dan lupakan PIN di HP ini">Kunci</button>` : ''}</div>`;
  if (L.state === 'pin'){
    h += `<form class="card" id="cbxPin"><p class="note" style="margin:0 0 10px">Daftar nama murid dilindungi PIN, sama dengan PIN halaman Student.</p>
      <div class="stu-bar"><input class="stu-input stu-pin-input" id="cbxPinIn" type="password" inputmode="numeric" autocomplete="current-password" aria-label="PIN"><button class="btn stu-go" type="submit" style="width:auto;margin:0">Buka</button></div>
      ${L.err ? `<p class="note">${esc(L.err)}</p>` : ''}</form>`;
  } else if (L.state === 'err'){
    h += `<div class="notice">${esc(L.err)}</div><button class="btn" type="button" data-retry>Coba lagi</button>`;
  } else if (L.state !== 'ok'){
    h += '<div class="skel"></div>';
  } else {
    // Tiga baris pilihan (status, sisa tagihan, Active) saling mempersempit. Angka di tiap tombol = jumlah murid bila
    // tombol itu dipilih, dengan dua baris lainnya tetap seperti pilihan sekarang.
    const base = L.data.rows.filter(x => (center === 'ALL' || x.c === center) && needed(x, t)), F = listFilters(t);
    const G = [
      {attr: 'data-lf', aria: 'Pilih status', opts: F, cur: F.find(f => f[0] === L.f) || F[0]},
      {attr: 'data-la', aria: 'Pilih sisa tagihan', opts: AMOUNTS, cur: AMOUNTS.find(a => a[0] === L.amt) || AMOUNTS[0]},
      {attr: 'data-lact', aria: 'Pilih status Student Management', opts: ACTIVES, cur: ACTIVES.find(a => a[0] === L.act) || ACTIVES[0]}];
    const pass = (x, skip) => G.every(g => g === skip || g.cur[2](x));
    const rows = base.filter(x => pass(x)), sum = rows.reduce((a, x) => a + (x.sisa || 0), 0);
    const chosen = G.filter(g => g.cur[0] !== 'ALL').map(g => g.cur[1].toLowerCase());
    h += `<div class="cbar cchips" role="group" aria-label="Pilih center">${['ALL'].concat(DA.CENTERS).map(c => `<button type="button" class="cchip" data-lc="${c}" aria-pressed="${c===center}">${c==='ALL' ? 'Semua' : c}</button>`).join('')}</div>
      ${G.map(g => `<div class="cbar cchips" role="group" aria-label="${g.aria}">${g.opts.map(o => `<button type="button" class="cchip" ${g.attr}="${o[0]}" aria-pressed="${o===g.cur}">${esc(o[1])} <small>${base.filter(x => pass(x, g) && o[2](x)).length}</small></button>`).join('')}</div>`).join('')}
      ${L.data.missing.length ? `<div class="notice info">Kolom ${esc(L.data.missing.join(' dan '))} belum terbaca. Pastikan Apps Script di Exboard versi terbaru (tempel Code.gs, lalu Deploy → Manage deployments → edit → Version: New version) dan judul kolomnya ada di baris 7 CB Tracker.</div>` : ''}
      <p class="note" style="margin:0 0 10px">${R.fmt(rows.length,0)} murid${chosen.map(c => ' · ' + esc(c)).join('')}${center==='ALL' ? '' : ' · ' + center} · sisa tagihan ${R.fmtRp(sum)}. Urut dari jatuh tempo paling lama. Data CB Tracker ${esc(shortDate(L.data.at.slice(0,10), t.y))} ${esc(L.data.at.slice(11))}.</p>`;
    h += rows.length ? `<div class="list">${rows.slice(0, L.show).map(x => itemHtml(x, t)).join('')}</div>` : R.empty('Tidak ada murid', 'Tidak ada murid dengan pilihan ini.');
    if (rows.length > L.show) h += `<button class="btn" type="button" data-more style="margin-top:10px;width:100%">Tampilkan ${Math.min(STEP, rows.length - L.show)} lagi (${R.fmt(rows.length - L.show,0)} tersisa)</button>`;
  }
  el.innerHTML = h;
}
$('#cbx').addEventListener('click', e => {
  const c = e.target.closest('[data-lc]'), f = e.target.closest('[data-lf]');
  if (c){ DA.center.set(c.dataset.lc); center = c.dataset.lc; L.show = STEP; view.redraw(); drawList(); $('#cbx').scrollIntoView({block: 'start'}); }
  else if (f){ L.f = f.dataset.lf; DA.lsSet(LIST_KEY, L.f); L.show = STEP; drawList(); }
  else if (e.target.closest('[data-la]')){ L.amt = e.target.closest('[data-la]').dataset.la; DA.lsSet(AMT_KEY, L.amt); L.show = STEP; drawList(); }
  else if (e.target.closest('[data-lact]')){ L.act = e.target.closest('[data-lact]').dataset.lact; DA.lsSet(SM_KEY, L.act); L.show = STEP; drawList(); }
  else if (e.target.closest('[data-more]')){ L.show += STEP; drawList(); }
  else if (e.target.closest('[data-retry]')) loadList(true);
  else if (e.target.closest('[data-lock]')){ pin = ''; DA.lsSet(DA.PIN_KEY, ''); L.data = null; L.err = ''; L.state = 'pin'; drawList(); }
});
$('#cbx').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#cbxPinIn').value.trim();
  if (v){ pin = v; loadList(); }
});
$('#pullBtn').addEventListener('click', () => { if (pin && L.state !== 'loading') loadList(true); });
loadList();
const view = R.start({feed: FEED, render, foot: 'Status, sisa tagihan, dan jatuh tempo dihitung dari tab CB Tracker Exboard untuk seluruh histori. Jatuh tempo = 30 hari setelah bayar terakhir. Kurang bayar di bawah Rp 300.000 dianggap lunas (diskon). Daftar nama murid ada di CB Tracker.'});
})();
</script>
</body>
</html>
