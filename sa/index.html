<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Acquisition per SA</title>
<meta name="description" content="CVR, Full Pay Rate, FP SD dan Revenue per Student Advisor.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="theme-color" content="#1B6FB5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1114" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/shell.css">
<style>
:root{
  color-scheme: light;
  --page:#f3f4f1; --surface:#ffffff; --surface-2:#f6f6f3; --ink:#0b0b0b; --ink-2:#52514e; --muted:#7d7b75;
  --border:rgba(11,11,11,.10); --border-2:rgba(11,11,11,.18); --track:#ecebe6;
  --accent:#1c5cab; --accent-ink:#ffffff; --accent-soft:#e7eefa;
  --good:#0ca30c; --crit:#d03b3b; --good-ink:#0a6b0a; --crit-ink:#a32626; --good-bg:#e4f4e4; --crit-bg:#fbe6e6;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8f8d86;
    --border:rgba(255,255,255,.10); --border-2:rgba(255,255,255,.2); --track:#2c2c2a;
    --accent:#5598e7; --accent-ink:#0b0b0b; --accent-soft:#1b2a3e;
    --good-ink:#74d874; --crit-ink:#f39292; --good-bg:#13301a; --crit-bg:#3d1a1a;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8f8d86;
  --border:rgba(255,255,255,.10); --border-2:rgba(255,255,255,.2); --track:#2c2c2a;
  --accent:#5598e7; --accent-ink:#0b0b0b; --accent-soft:#1b2a3e;
  --good-ink:#74d874; --crit-ink:#f39292; --good-bg:#13301a; --crit-bg:#3d1a1a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.45 "Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
@media (min-width:900px){ body{padding-bottom:40px} }
button,select{font:inherit;color:inherit}
h1,h2{margin:0;line-height:1.25}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.top-inner{display:flex;align-items:center;gap:12px;min-height:60px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:var(--accent-ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand{min-width:0;flex:1 1 auto}
.brand h1{font-size:17px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok::before{background:var(--good)}
.sync.busy::before{background:#fab219}
.sync.err::before{background:var(--crit)}
@media (max-width:480px){ .sync{max-width:132px;overflow:hidden;text-overflow:ellipsis} }

/* App nav */

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--border-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.icon{width:40px;padding:0;flex:none}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
select{min-height:40px;border:1px solid var(--border-2);border-radius:10px;background:var(--surface);padding:8px 10px;font-size:16px}
select:focus,.btn:focus-visible,.appnav a:focus-visible,.chip:focus-visible,.sa-head:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Filter bar */
.fbar{position:sticky;top:0;z-index:20;background:var(--page);border-bottom:1px solid var(--border)}
.fb{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1 1 320px;min-width:0;scrollbar-width:none;padding:1px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--border-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;letter-spacing:.02em}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.sort{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:600}
.sort select{font-size:15px;min-height:36px;padding:5px 8px}
/* Baris periode: Harian / Mingguan / Bulanan + navigasi (sama dengan halaman Rekap) */
.weekrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px;flex:1 1 100%}
.modeseg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px}
.modeseg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.modeseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.modeseg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:600px){ .modeseg{flex:1 1 100%} .modeseg button{flex:1} }
.wb-nav{display:flex;align-items:center;gap:8px;flex:1 1 260px;max-width:480px;min-width:0}
.wb-nav select,.wb-nav input[type=date]{flex:1 1 auto;min-height:38px}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}

main{padding-top:16px}
.notice{border-radius:12px;padding:12px 14px;font-size:13.5px;background:var(--crit-bg);color:var(--crit-ink);margin-bottom:14px}
.notice a{color:inherit;font-weight:700}
.notice[hidden]{display:none}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.sec-head h2{font-size:16px;font-weight:650}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .kpis .kpi:last-child{grid-column:1 / -1} }
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
.kpi .k-label{font-size:12.5px;color:var(--ink-2);font-weight:600}
.kpi .k-val{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 4px;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .k-foot{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* SA list */
.list{display:grid;gap:10px}
.sa{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.sa-head{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px;cursor:pointer}
.sa-top{display:flex;align-items:center;gap:10px}
.rank{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--ink-2);flex:none;font-variant-numeric:tabular-nums}
.sa:nth-child(-n+3) .rank{background:var(--accent-soft);color:var(--accent)}
.sa-name{font-size:16px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctr{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:0 6px;flex:none}
.seg{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:0 7px;white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.seg b{font-weight:800}
.chev{margin-left:auto;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none;transition:transform .15s}
.sa.open .chev{transform:rotate(180deg)}
.mets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 14px;margin-top:10px}
@media (max-width:600px){ .mets{grid-template-columns:repeat(2,minmax(0,1fr))} .mets .met:last-child{grid-column:1 / -1} }
.met{min-width:0}
.met .ml{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.met .mv{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap}
.met .mv.g{color:var(--good-ink)} .met .mv.r{color:var(--crit-ink)}
.met.sorted .ml{color:var(--accent)}
.meter{height:5px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:4px;position:relative}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent);opacity:.75}
.meter b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-2);border-radius:1px}
.sa-body{border-top:1px solid var(--border);padding:12px 14px 14px;background:var(--surface-2)}
.sa-body[hidden]{display:none}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px 14px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:11.5px;color:var(--muted);font-weight:600}
.facts dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.facts dd small{font-weight:600;color:var(--ink-2)}
.why{margin:12px 0 0;font-size:13.5px;color:var(--ink-2)}
.why b{color:var(--ink)}
.sa.inactive{box-shadow:none;background:transparent;border-style:dashed}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.empty-state{text-align:center;padding:40px 16px;border:1px dashed var(--border-2);border-radius:14px;background:var(--surface)}
.empty-state h2{font-size:17px;margin-bottom:6px}
.empty-state p{color:var(--ink-2);margin:0 auto;max-width:460px;font-size:14px}
.skel{height:120px;border-radius:14px;margin-bottom:12px;background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.4s infinite linear;border:1px solid var(--border)}
@keyframes sh{to{background-position:-200% 0}}
.foot{font-size:12.5px;color:var(--muted);margin:24px 0 8px;display:grid;gap:4px}
.foot a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){ .skel,.btn.spin svg{animation:none} .chev{transition:none} }
</style>

</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div class="logo" aria-hidden="true"><img src="../assets/sparks-mark.png" alt="" width="34" height="34"></div>
    <div class="brand">
      <h1>Acquisition SA</h1>
      <p id="period">Student Advisor · Exboard</p>
    </div>
    <div class="right">
      <span class="sync" id="status">Memuat…</span>
      <button class="btn icon" id="pullBtn" type="button" aria-label="Tarik ulang data"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
    </div>
  </div>
</header>

<div class="fbar">
  <div class="wrap fb">
    <div class="weekrow">
      <div class="modeseg" id="modeSeg" role="group" aria-label="Jenis periode">
        <button type="button" data-mode="day" aria-pressed="false">Harian</button>
        <button type="button" data-mode="week" aria-pressed="false">Mingguan</button>
        <button type="button" data-mode="month" aria-pressed="true">Bulanan</button>

        <button class="btn icon" id="wNext" type="button" aria-label="Periode berikutnya">›</button>

<main class="wrap">

  <div id="view"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>

</main>

<script>
(function(){
'use strict';

/* ================= Konfigurasi ================= */
// Sheet "Feed Acquisition SA (dari Exboard)": A1 = IMPORTRANGE tab "02B Acquisition SA".
// Agar bisa dibaca dari luar claude.ai, Sheet ini harus dibagikan "Siapa saja yang memiliki link" (Viewer).
const FEED_ID = '1Jty6C-Ss4Un5MVyZ73O6qGmM4Fa_97_r_2yqJb7Wb-s';
const FEED_URL = `https://docs.google.com/spreadsheets/d/${FEED_ID}/edit`;
const CENTERS = ['KLM','KWC','PML','BTU','TMP','HIB'];
const REV_UNIT = 1000;              // kolom Revenue di Exboard dalam ribuan rupiah ("95,000" = Rp 95 jt)
const LOW = 0.7;                    // merah = 30% di bawah rata-rata area (aturan yang sama dengan tab 02B)
const CACHE_KEY = 'saLite.cache.v1';
const UI_KEY = 'saLite.ui.v1';
const STALE_MS = 5 * 60 * 1000;
const METRICS = {
  cvr:  {label:'CVR SU→Paid', short:'CVR SU→Paid'},
  bt:   {label:'CVR Baby Tiny', short:'CVR Baby Tiny'},
  fpr:  {label:'Full Pay Rate', short:'Full Pay'},
  fpsd: {label:'FP SD', short:'FP SD'},
  rev:  {label:'Revenue', short:'Revenue'}
};
// Segmen umur di blok B feed (urutan sama dengan kolom 02B Acquisition SA)
const SEGS = [
  ['Baby',  'Baby (6–17 bln)'],
  ['Tiny',  'Tiny (18–36 bln)'],
  ['Little','Little (3–5 th)'],
  ['Kids',  'Kids (5–8+ th)'],
  ['Star',  'Star (9–12 th)']
];
const SEG_MIN_SU = 3;   // segmen dianggap "juara" hanya bila show up-nya cukup
// Periode lain (Harian/Mingguan/bulan selain Reporting Month) dihitung langsung dari tab mentah Exboard
// lewat query gviz publik (tanpa auth): Register Trial, Student Database, dan Revenue Record.
const EX_ID = '1CLm1NYROYjPEGisRGw-A2ZMEk7OP6d3pDJywxTBJDXA';
const PERIOD_KEY = 'saLite.period.v1';
const PCAL_KEY = 'saLite.pcal.v1';  // cache hasil hitung periode terakhir
const MIN_MONTH = '2026-05';        // awal data Register Trial
const MON = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MON_PJG = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MONTHS_EN = ['january','february','march','april','may','june','july','august','september','october','november','december'];
// "6-17 Mo" dst di kolom E Register Trial → indeks segmen (urutan sama dengan SEGS)
const AGE_IX = {'6-17 mo':0,'18-36 mo':1,'3-5 yo':2,'5-8+ yo':3,'9-12 yo':4};

/* ================= Util ================= */
const $ = s => document.querySelector(s);
const {esc, lsGet, lsSet, fmtTime, parseCSV, sheetNum, fetchPublicCsv} = DA;
const fmt = (v, d=1) => (v==null || isNaN(v)) ? '—' : Number(v).toLocaleString('id-ID',{maximumFractionDigits:d});
const fmtPct = (v, d=1) => (v==null || isNaN(v)) ? '—' : fmt(v,d) + '%';
function fmtRpS(v){
  if (v==null || isNaN(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1e9) return 'Rp ' + fmt(v/1e9, 2) + ' M';
  if (a >= 1e6) return 'Rp ' + fmt(v/1e6, 1) + ' jt';
  if (a >= 1e3) return 'Rp ' + fmt(v/1e3, 0) + ' rb';
  return 'Rp ' + fmt(v, 0);
}
const fmtRp = v => (v==null || isNaN(v)) ? '—' : 'Rp ' + Math.round(v).toLocaleString('id-ID');
const num0 = s => { s = String(s==null ? '' : s).replace(/[\s,]/g,''); if (!s || s === '-') return 0; const n = Number(s); return isFinite(n) ? n : 0; };

/* ================= Tanggal & periode ================= */
const pad2 = n => String(n).padStart(2,'0');
const isoOf = d => d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
const TODAY = isoOf(new Date());
const CUR_MONTH = TODAY.slice(0,7);
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return isoOf(d); };
const daysInMonth = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
function shiftMonth(m, n){ let [y, mo] = m.split('-').map(Number); mo += n; y += Math.floor((mo-1)/12); mo = ((mo-1)%12+12)%12+1; return y + '-' + pad2(mo); }
function isoWeekOf(s){
  const d = new Date(s + 'T12:00:00');
  const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay()+6)%7));
  const thu = new Date(mon); thu.setDate(mon.getDate()+3);
  const y = thu.getFullYear(), jan4 = new Date(y, 0, 4, 12);
  const w1 = new Date(jan4); w1.setDate(jan4.getDate() - ((jan4.getDay()+6)%7));
  return y + '-W' + pad2(Math.round((mon - w1)/6048e5) + 1);
}
function mondayOf(week){
  const [y, w] = week.split('-W').map(Number), jan4 = new Date(y, 0, 4, 12);
  const mon = new Date(jan4); mon.setDate(jan4.getDate() - ((jan4.getDay()+6)%7) + (w-1)*7);
  return isoOf(mon);
}
const shiftWeek = (k, n) => isoWeekOf(addDays(mondayOf(k), 7*n));
const dayTxt = s => { const d = new Date(s+'T12:00:00'); return `${d.getDate()} ${MON_PJG[d.getMonth()]} ${d.getFullYear()}`; };
const monthTxt = m => `${MON_PJG[+m.slice(5)-1]} ${m.slice(0,4)}`;
function weekRangeTxt(week){
  const a = mondayOf(week), b = addDays(a, 6);
  const da = new Date(a+'T12:00:00'), db = new Date(b+'T12:00:00');
  if (da.getMonth() !== db.getMonth() || da.getFullYear() !== db.getFullYear())
    return `${da.getDate()} ${MON[da.getMonth()]} – ${db.getDate()} ${MON[db.getMonth()]} ${db.getFullYear()}`;
  return `${da.getDate()}–${db.getDate()} ${MON[db.getMonth()]} ${db.getFullYear()}`;
}
// "Periode" aktif: kunci cache, rentang tanggal, dan label
const P = {
  cur: { day: () => TODAY, week: () => isoWeekOf(TODAY), month: () => CUR_MONTH },
  min: { day: MIN_MONTH + '-01', week: isoWeekOf(MIN_MONTH + '-01'), month: MIN_MONTH },
  keyOf: p => p.mode==='day' ? 'd:' + p.day : p.mode==='week' ? 'w:' + p.week : 'm:' + p.month,
  rangeOf: p => p.mode==='day' ? [p.day, p.day]
    : p.mode==='week' ? [mondayOf(p.week), addDays(mondayOf(p.week), 6)]
    : [p.month + '-01', p.month + '-' + pad2(daysInMonth(p.month))],
  labelOf: p => p.mode==='day' ? dayTxt(p.day)
    : p.mode==='week' ? `W${p.week.slice(6)} · ${weekRangeTxt(p.week)}`
    : monthTxt(p.month)
};
// Tanggal toleran di kolom Tanggal Full Payment (format sel campur): "2026-10-30", "30-Oct-2026",
// "30 Oct 2026", "10/15/2026" (bulan/tanggal) dan "25/8/2026" (tanggal/bulan).
const MON_EN3 = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function parseDateAny(s){
  s = String(s==null ? '' : s).replace(/\s+/g,' ').trim(); if (!s) return null;
  let m;
  if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s))) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  if ((m = /^(\d{1,2})[ \-]([A-Za-z]{3,})\.?[ \-](\d{4})$/.exec(s))){
    const k = MON_EN3.indexOf(m[2].slice(0,3).toLowerCase());
    return k >= 0 ? `${m[3]}-${pad2(k+1)}-${pad2(m[1])}` : null;
  }
  if ((m = /^([A-Za-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})$/.exec(s))){
    const k = MON_EN3.indexOf(m[1].slice(0,3).toLowerCase());
    return k >= 0 ? `${m[3]}-${pad2(k+1)}-${pad2(m[2])}` : null;
  }
  if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s))){
    const a = +m[1], b = +m[2];
    if (b > 12) return `${m[3]}-${pad2(a)}-${pad2(b)}`;   // m/d/yyyy (contoh "8/30/2026")
    return `${m[3]}-${pad2(b)}-${pad2(a)}`;               // d/m/yyyy (asumsi locale id)
  }
  return null;
}
async function gvizCsv(sheet, tq){
  const url = `https://docs.google.com/spreadsheets/d/${EX_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}&tq=${encodeURIComponent(tq)}`;
  const res = await fetch(url);
  if (!res.ok) throw Object.assign(new Error('HTTP ' + res.status), {code:'gviz'});
  return res.text();
}

/* ================= Baca feed ================= */
const norm = s => String(s||'').toLowerCase().replace(/\s+/g,' ').replace(/→/g,'>').trim();
// Kolom dicari dari judulnya, jadi tetap terbaca bila urutan kolom di Exboard berubah
const COLS = {
  center:'center', leads:'leads', showUp:'show up', noShow:'no show', paidDp:'paid dp', paidFull:'paid full',
  totalPaid:'total paid', fpsd:'fp sd', rev:'revenue', suRate:'show up rate', cvr:'cvr su>paid',
  fpr:'full pay rate', sunp:'sunp', sunpRate:'sunp / show up', revPerSu:'rev / show up'
};
function parseFeed(text){
  const rows = parseCSV(text);
  const out = {sas:[], total:null, period:'', refErr: /^\s*"?#REF!/.test(text)};
  const pr = rows.find(r => norm(r[0]).startsWith('periode'));
  if (pr) out.period = (pr[1]||'').trim();
  // A. FUNNEL & KONVERSI PER SA
  const hi = rows.findIndex(r => norm(r[0])==='student advisor' && norm(r[1])==='center');
  if (hi < 0) return out;
  const head = rows[hi].map(norm), col = {};
  Object.entries(COLS).forEach(([k, name]) => { col[k] = head.indexOf(name); });
  const val = (r, k) => col[k] >= 0 ? sheetNum(r[col[k]]) : null;
  for (const r of rows.slice(hi+1)){
    const name = (r[0]||'').trim();
    if (/^[A-Z]\.\s/.test(name)) break;                 // bagian berikutnya
    if (!name) continue;
    const e = {name, center: (r[col.center]||'').trim().toUpperCase()};
    ['leads','showUp','noShow','paidDp','paidFull','totalPaid','fpsd','rev','suRate','cvr','fpr','sunp','sunpRate','revPerSu'].forEach(k => e[k] = val(r, k));
    if (e.rev!=null) e.rev *= REV_UNIT;
    if (e.revPerSu!=null) e.revPerSu *= REV_UNIT;
    if (name.toUpperCase()==='TOTAL'){ out.total = e; break; }
    out.sas.push(e);
  }
  // B. ANALISA AGE GROUP: show up & CVR Baby (6-17 Mo) / Tiny (18-36 Mo).
  // CVR Baby Tiny = (paid Baby + paid Tiny) / (SU Baby + SU Tiny); paid per segmen = SU × CVR segmen itu.
  const bi = rows.findIndex((r, i) => i > hi && norm(r[0])==='student advisor' && r.some(c => norm(c)==='6-17 mo show up'));
  if (bi >= 0){
    const h = rows[bi].map(norm), at = name => h.indexOf(name);
    const ix = {
      suBaby: at('6-17 mo show up'), suTiny: at('18-36 mo show up'),
      suLittle: at('3-5 yo show up'), suKids: at('5-8+ yo show up'), suStar: at('9-12 yo show up'),
      cvrBaby: at('6-17 mo cvr'), cvrTiny: at('18-36 mo cvr'),
      cvrLittle: at('3-5 yo cvr'), cvrKids: at('5-8+ yo cvr'), cvrStar: at('9-12 yo cvr')
    };
    const by = new Map(out.sas.map(s => [s.name.toLowerCase(), s]));
    for (const r of rows.slice(bi+1)){
      const name = (r[0]||'').trim();
      if (/^[A-Z]\.\s/.test(name) || name.toUpperCase()==='TOTAL') break;
      const s = by.get(name.toLowerCase()); if (!s) continue;
      Object.entries(ix).forEach(([k, j]) => { if (j >= 0) s[k] = sheetNum(r[j]); });
      // "-" di CVR padahal ada show up = belum ada yang bayar (0)
      const paid = (su, cvr) => su > 0 ? Math.round(su * (cvr || 0) / 100) : 0;
      s.suBT = (s.suBaby || 0) + (s.suTiny || 0);
      s.paidBT = paid(s.suBaby, s.cvrBaby) + paid(s.suTiny, s.cvrTiny);
      s.bt = s.suBT > 0 ? s.paidBT / s.suBT * 100 : null;
      s.segs = SEGS.map(([k, label]) => ({k, label, su: s['su' + k] || 0, cvr: s['cvr' + k]}));
    }
  }
  // C. SINYAL KUALITAS PITCHING: alasan gagal terbanyak per SA
  const ci = rows.findIndex((r, i) => i > hi && norm(r[0])==='student advisor' && r.some(c => norm(c)==='alasan gagal terbanyak'));
  if (ci >= 0){
    const h = rows[ci].map(norm), iw = h.indexOf('alasan gagal terbanyak'), ie = h.indexOf('% parent engaged');
    const by = new Map(out.sas.map(s => [s.name.toLowerCase(), s]));
    for (const r of rows.slice(ci+1)){
      const name = (r[0]||'').trim();
      if (/^[A-Z]\.\s/.test(name)) break;
      const s = by.get(name.toLowerCase()); if (!s) continue;
      s.topReason = (r[iw]||'').trim();
      if (ie >= 0) s.engaged = sheetNum(r[ie]);
    }
  }
  return out;
}

function feedMonthOf(s){

// Agregat dihitung ulang dari baris SA, supaya sama logikanya untuk "Semua" maupun per center
function agg(list){
  const sum = k => list.reduce((a,s) => a + (s[k]||0), 0);
  const su = sum('showUp'), paid = sum('totalPaid'), full = sum('paidFull');
  const suBT = sum('suBT'), paidBT = sum('paidBT');
  return {n:list.length, leads:sum('leads'), showUp:su, totalPaid:paid, paidFull:full, fpsd:sum('fpsd'), rev:sum('rev'),
    suBT, paidBT, bt: suBT > 0 ? paidBT/suBT*100 : null,
    cvr: su>0 ? paid/su*100 : null, fpr: paid>0 ? full/paid*100 : null};
}
// Warna hanya untuk rasio (CVR, CVR Baby Tiny, Full Pay Rate): hijau ≥ rata-rata area, merah < 70% rata-rata area
function tone(k, v, ref){
  if (v==null || ref==null || !(k==='cvr' || k==='bt' || k==='fpr')) return '';
  return v >= ref ? 'g' : v < ref*LOW ? 'r' : '';
}
// Age group dengan CVR tertinggi. Wajib punya show up cukup, supaya "1 dari 1 = 100%" tidak jadi juara.
function bestSeg(s){
  if (!s.segs) return null;
  const ada = s.segs.filter(x => x.cvr != null && x.su > 0);
  const cukup = ada.filter(x => x.su >= SEG_MIN_SU);
  const list = cukup.length ? cukup : ada;
  if (!list.length) return null;
  return list.slice().sort((a, b) => b.cvr - a.cvr || b.su - a.su)[0];
}

// Feed bulanan (roster + angka Reporting Month). Fallback selalu tersedia untuk mode Bulanan.
async function ensureFeed(force){
  if (feedData && !force) return true;
  const text = await fetchPublicCsv(FEED_ID);
  const now = Date.now(), p = parseFeed(text);
  if (!p.sas.length) return false;

// Hitung satu periode langsung dari Exboard: Register Trial (leads/SU/paid/age group),
// Student Database (FP SD), Revenue Record (revenue). Rumus mengikuti tab 02B Acquisition SA.
async function computePeriod(from, to){
  if (!roster) throw Object.assign(new Error('feed'), {code:'feed'});
  if (!sdRows){
    sdRows = parseCSV(await gvizCsv('Student Database', `select CA, BZ where E = 'Full'`)).slice(1);
  }
  const [rtCsv, rrCsv] = await Promise.all([
    gvizCsv('Register Trial', `select E,J,N,O,U,Z,AD where B >= date '${from}' and B <= date '${to}'`),
    gvizCsv('Revenue Record', `select J, sum(H) where S >= date '${from}' and S <= date '${to}' group by J format sum(H) '0'`)
  ]);
  const names = roster.map(r => r.name.toLowerCase());
  const blank = () => ({leads:0, su:0, noShow:0, dp:0, full:0, sunp:0, z:0, fpsd:0, rev:0,
    suAge:[0,0,0,0,0], paidAge:[0,0,0,0,0], reasons:new Map()});
  const agg = new Map(names.map(n => [n, blank()]));
  const isDp = o => o === 'regis fee only';
  const isFull = o => o === 'regis + member fee' || o === 'member fee';
  for (const r of parseCSV(rtCsv).slice(1)){
    const a = agg.get(norm(r[1])); if (!a) continue;
    const e = norm(r[0]), n = norm(r[2]), o = norm(r[3]), u = norm(r[4]), z = norm(r[5]), ad = norm(r[6]);
    a.leads++;
    if (n === 'true'){
      // Show Up di 02B mengecualikan Cross Poll dan 9-12 Yo
      if (ad !== 'cross poll' && e !== '9-12 yo') a.su++;
      if (u) a.sunp++;
      if (z.startsWith('sangat aktif')) a.z++;
      const ai = AGE_IX[e]; if (ai != null) a.suAge[ai]++;
    } else if (n === 'false') a.noShow++;
    if (ad !== 'cross poll'){
      const ai = AGE_IX[e];
      if (ai != null && (isDp(o) || isFull(o))) a.paidAge[ai]++;
      if (isDp(o)) a.dp++;
      if (isFull(o)) a.full++;
    }
    if (n === 'true' && u) a.reasons.set(u, (a.reasons.get(u) || 0) + 1);
  }
  for (const r of sdRows){
    const a = agg.get(norm(r[0])); if (!a) continue;
    const d = parseDateAny(r[1]);
    if (d && d >= from && d <= to) a.fpsd++;
  }
  for (const r of parseCSV(rrCsv).slice(1)){
    const j = norm(r[0]); if (!j) continue;
    // Revenue Record dipakai dengan awalan nama (rumus Sheets: $A7&"*") → nama terpanjang menang
    const best = names.filter(n => j.startsWith(n)).sort((x, y) => y.length - x.length)[0];
    if (best) agg.get(best).rev += num0(r[1]);
  }
  const zero = v => v > 0 ? v : null;   // sheet menampilkan 0 sebagai "-"
  return roster.map(r => {
    const a = agg.get(r.name.toLowerCase());
    const total = a.dp + a.full, suBT = a.suAge[0] + a.suAge[1], paidBT = a.paidAge[0] + a.paidAge[1];
    let top = null, max = 0;
    a.reasons.forEach((c, reason) => { if (c > max){ max = c; top = reason; } });
    return {
      name: r.name, center: r.center,
      leads: zero(a.leads), showUp: zero(a.su), noShow: zero(a.noShow),
      paidDp: zero(a.dp), paidFull: zero(a.full), totalPaid: zero(total),
      fpsd: zero(a.fpsd), rev: zero(a.rev),
      suRate: a.leads > 0 && a.su > 0 ? a.su/a.leads*100 : null,
      cvr: a.su > 0 && total > 0 ? total/a.su*100 : null,
      fpr: total > 0 && a.full > 0 ? a.full/total*100 : null,
      sunp: zero(a.sunp), sunpRate: a.su > 0 && a.sunp > 0 ? a.sunp/a.su*100 : null,
      revPerSu: a.fpsd > 0 && a.rev > 0 ? a.rev/a.fpsd : null,
      suBT: zero(suBT), paidBT, bt: suBT > 0 && paidBT > 0 ? paidBT/suBT*100 : null,
      segs: SEGS.map(([k, label], i) => ({k, label, su: zero(a.suAge[i]),
        cvr: a.suAge[i] > 0 && a.paidAge[i] > 0 ? a.paidAge[i]/a.suAge[i]*100 : null})),
      topReason: top,
      engaged: a.su > 0 && a.z > 0 ? a.z/a.su*100 : null
    };
  });
}
function applyCalc(rec, label){
  data = {sas: rec.sas, total: null, period: label, pulledAt: rec.pulledAt, src: 'calc'};
}
async function loadPeriod(force){
  if (pulling) return;
  pulling = true; $('#pullBtn').disabled = true; $('#pullBtn').classList.add('spin');
  setStatus('busy', 'Menarik data…');
  const p = ui.period, key = P.keyOf(p);
  try {
    const cached = calcCache.get(key);
    if (cached && !force){
      applyCalc(cached, P.labelOf(p));
      setStatus('ok', 'Tersinkron · ' + fmtTime(cached.pulledAt));
      showErr('');
      return;
    }
    const okFeed = await ensureFeed(force);
    if (!okFeed) throw Object.assign(new Error('feed'), {code:'feed'});
    if (p.mode === 'month' && !p.month){
      p.month = feedMonthKey || CUR_MONTH;                       // default: Reporting Month di Exboard
      lsSet(PERIOD_KEY, ui.period); syncBar();
    }
    if (p.mode === 'month' && p.month === feedMonthKey){
      // Bulan Reporting Month = angka persis tab 02B (sumber resmi)
      data = Object.assign({}, feedData, {src: 'feed'});
      setStatus('ok', 'Tersinkron · ' + fmtTime(feedData.pulledAt));
      showErr('');
    } else {
      const [from, to] = P.rangeOf(p);
      const sas = await computePeriod(from, to);
      const rec = {sas, pulledAt: Date.now()};
      calcCache.set(key, rec);
      lsSet(PCAL_KEY, {key, sas, pulledAt: rec.pulledAt});
      applyCalc(rec, P.labelOf(p));
      setStatus('ok', 'Tersinkron · ' + fmtTime(rec.pulledAt));
      showErr('');
    }
  } catch(err){
    setStatus('err', data ? 'Data ' + fmtTime(data.pulledAt) : 'Gagal menarik');
    const why = err.code === 'feed'
      ? `Feed 02B belum bisa dibaca. Buka <a href="${FEED_URL}" target="_blank" rel="noopener">Sheet feed</a>, klik sel A1, lalu pilih "Allow access".`
      : `Exboard (tab Register Trial, Student Database, atau Revenue Record) belum bisa dibaca. Coba tarik ulang, atau kembali ke mode <b>Bulanan</b>.`;
    showErr(`<b>Data periode ini belum bisa dihitung.</b> ${why}${data ? ` Menampilkan data terakhir (${esc(fmtTime(data.pulledAt))}).` : ''}`);
  } finally {
    pulling = false; $('#pullBtn').disabled = false; $('#pullBtn').classList.remove('spin');
    render();
  }
}

/* ================= Baris periode ================= */
function syncBar(){
  const p = ui.period, m = p.mode;
  document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  $('#dSel').hidden = m !== 'day';
  $('#wSel').hidden = m === 'day';
  if (m === 'day'){
    const d = $('#dSel'); d.value = p.day; d.min = P.min.day; d.max = TODAY;
  } else if (m === 'week'){
    const list = []; let k = P.cur.week();
    for (let i = 0; i < 12 && k >= P.min.week; i++){ list.unshift(k); k = shiftWeek(k, -1); }
    $('#wSel').innerHTML = list.map(x => `<option value="${x}"${x===p.week?' selected':''}>W${x.slice(6)} · ${weekRangeTxt(x)}</option>`).join('');
  } else {
    const list = []; let k = CUR_MONTH;
    for (let i = 0; i < 8 && k >= P.min.month; i++){ list.unshift(k); k = shiftMonth(k, -1); }
    $('#wSel').innerHTML = list.map(x => `<option value="${x}"${x===p.month?' selected':''}>${monthTxt(x)}</option>`).join('');
  }
  const atMin = m==='day' ? p.day <= P.min.day : m==='week' ? p.week <= P.min.week : p.month <= P.min.month;
  const atMax = m==='day' ? p.day >= TODAY : m==='week' ? p.week >= P.cur.week() : p.month >= CUR_MONTH;
  $('#wPrev').disabled = atMin; $('#wNext').disabled = atMax;
  $('#wLatest').textContent = m === 'day' ? 'Hari ini' : 'Terbaru';
  $('#wLatest').disabled = atMax;
}
function setKey(k){
  const p = ui.period;
  if (p.mode==='day') p.day = k; else if (p.mode==='week') p.week = k; else p.month = k;
  lsSet(PERIOD_KEY, ui.period);
  syncBar(); loadPeriod();
}
function step(n){
  const p = ui.period;
  setKey(p.mode==='day' ? addDays(p.day, n) : p.mode==='week' ? shiftWeek(p.week, n) : shiftMonth(p.month, n));
}
function setMode(m){
  if (ui.period.mode === m) return;
  ui.period.mode = m;
  lsSet(PERIOD_KEY, ui.period);
  syncBar(); loadPeriod();
}

/* ================= Event ================= */
$('#modeSeg').addEventListener('click', e => { const b = e.target.closest('button[data-mode]'); if (b) setMode(b.dataset.mode); });
$('#wSel').addEventListener('change', e => setKey(e.target.value));
$('#dSel').addEventListener('change', e => { const v = e.target.value; if (v && v <= TODAY) setKey(v); });
$('#wPrev').addEventListener('click', () => step(-1));
$('#wNext').addEventListener('click', () => step(1));
$('#wLatest').addEventListener('click', () => setKey(P.cur[ui.period.mode]()));
$('#sortSel').addEventListener('change', e => { ui.sort = e.target.value; lsSet(UI_KEY, ui); render(); });
$('#view').addEventListener('click', e => {
  const h = e.target.closest('button.sa-head'); if (!h) return;
  const id = h.dataset.id, art = h.parentElement, body = art.querySelector('.sa-body');
  const open = !openSet.has(id);
  if (open) openSet.add(id); else openSet.delete(id);
  art.classList.toggle('open', open); h.setAttribute('aria-expanded', String(open)); body.hidden = !open;
});
$('#pullBtn').addEventListener('click', () => loadPeriod(true));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (!data || Date.now() - data.pulledAt > STALE_MS)) loadPeriod(true);
});

/* ================= Mulai ================= */
DA.mountNav('sa');
const cached = lsGet(CACHE_KEY);
if (cached && typeof cached.text === 'string'){
  const p = parseFeed(cached.text);
  if (p.sas.length){ setFeed(p, cached.pulledAt); setStatus('', 'Data ' + fmtTime(cached.pulledAt)); }
}
const pcal = lsGet(PCAL_KEY);
if (pcal && pcal.key === P.keyOf(ui.period) && Array.isArray(pcal.sas) && roster
    && !(ui.period.mode === 'month' && ui.period.month === feedMonthKey)){
  calcCache.set(pcal.key, {sas: pcal.sas, pulledAt: pcal.pulledAt || 0});
  applyCalc(calcCache.get(pcal.key), P.labelOf(ui.period));
}
syncBar();
render();
loadPeriod();
})();
</script>
