<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard Area</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<script>
// Buka langsung dashboard yang terakhir dilihat (bawaan: Rekap)
(function(){
  var last = null;
  try { last = localStorage.getItem('dashboardApp.last'); } catch(e){}
  location.replace(last === 'slot-map' ? 'slot-map/' : last === 'sa' ? 'sa/' : 'rekap/');
})();
</script>
<style>
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f4f1;color:#0b0b0b;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
@media (prefers-color-scheme: dark){ body{background:#0d0d0d;color:#fff} a{color:#5598e7} }
nav{display:grid;gap:10px;text-align:center}
a{color:#1c5cab;font-weight:600}
</style>
</head>
<body>
<nav>
  <a href="rekap/">Rekap Mingguan Area</a>
  <a href="sa/">Acquisition per SA</a>
  <a href="slot-map/">Slot Map Kelas</a>
</nav>

</html>
