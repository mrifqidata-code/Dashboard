<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rekap Area</title>
<meta name="description" content="Rekap harian, mingguan dan bulanan: acquisition, revenue, CVR dan DP → FP per center.">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme: light;
  --page:#f3f4f1; --surface:#ffffff; --surface-2:#f6f6f3; --ink:#0b0b0b; --ink-2:#52514e; --muted:#7d7b75;
  --border:rgba(11,11,11,.10); --border-2:rgba(11,11,11,.18); --axis:#c3c2b7;
  --accent:#1c5cab; --accent-ink:#ffffff; --accent-soft:#e7eefa;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-bg:#e4f4e4; --good-ink:#0a6b0a; --warn-bg:#fff2d3; --warn-ink:#7a5200; --crit-bg:#fbe6e6; --crit-ink:#a32626;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8f8d86;
    --border:rgba(255,255,255,.10); --border-2:rgba(255,255,255,.2); --axis:#44443f;
    --accent:#5598e7; --accent-ink:#0b0b0b; --accent-soft:#1b2a3e;
    --good-bg:#13301a; --good-ink:#74d874; --warn-bg:#3a2e10; --warn-ink:#f7c85a; --crit-bg:#3d1a1a; --crit-ink:#f39292;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#8f8d86;
  --border:rgba(255,255,255,.10); --border-2:rgba(255,255,255,.2); --axis:#44443f;
  --accent:#5598e7; --accent-ink:#0b0b0b; --accent-soft:#1b2a3e;
  --good-bg:#13301a; --good-ink:#74d874; --warn-bg:#3a2e10; --warn-ink:#f7c85a; --crit-bg:#3d1a1a; --crit-ink:#f39292;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page); color:var(--ink);
  font:15px/1.45 "Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
@media (min-width:900px){ body{padding-bottom:40px} }
button,select{font:inherit;color:inherit}
h1,h2{margin:0;line-height:1.25}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.muted{color:var(--muted)}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.top-inner{display:flex;align-items:center;gap:12px;min-height:60px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:var(--accent-ink);fill:none;stroke-width:2;stroke-linecap:round}
.brand{min-width:0;flex:1 1 auto}
.brand h1{font-size:17px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;font-size:12.5px;color:var(--ink-2)}
.right{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok::before{background:var(--good)}
.sync.busy::before{background:var(--warn)}
.sync.err::before{background:var(--crit)}
@media (max-width:480px){ .brand p{display:none} .sync{max-width:132px;overflow:hidden;text-overflow:ellipsis} }

/* App nav (Rekap / Slot Map) */
.appnav{display:flex;gap:4px}
.appnav a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;color:var(--ink-2);font-weight:600;font-size:14px;text-decoration:none}
.appnav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.appnav a:hover{background:var(--surface-2);color:var(--ink)}
.appnav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
@media (max-width:899px){
  .appnav{position:fixed;left:0;right:0;bottom:0;z-index:30;gap:0;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .appnav a{flex:1;flex-direction:column;gap:2px;font-size:11.5px;padding:6px 2px}
  .appnav a[aria-current="page"]{background:transparent}
}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--border-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn.icon{width:40px;padding:0;font-size:20px;line-height:1;flex:none}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
select{min-height:40px;border:1px solid var(--border-2);border-radius:10px;background:var(--surface);padding:8px 10px;font-size:16px;width:100%;min-width:0}
select:focus,.btn:focus-visible,.appnav a:focus-visible,.trend th button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Week bar */
.weekbar{position:sticky;top:0;z-index:20;background:var(--page);border-bottom:1px solid var(--border)}
.wb{display:flex;align-items:center;gap:8px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.wb select,.wb input[type=date]{flex:1 1 auto}
.wb-nav{display:flex;align-items:center;gap:8px;flex:1 1 260px;max-width:460px;min-width:0}
input[type=date]{min-height:40px;border:1px solid var(--border-2);border-radius:10px;background:var(--surface);padding:6px 10px;font-size:16px;width:100%;min-width:0;color:inherit;font-family:inherit}
input[type=date]:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=date][hidden],select[hidden]{display:none}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:600px){ .seg{flex:1 1 100%} .seg button{flex:1} }
.notice.info{background:var(--accent-soft);color:var(--ink)}

main{padding-top:16px}
.notice{border-radius:12px;padding:12px 14px;font-size:13.5px;background:var(--warn-bg);color:var(--warn-ink);margin-bottom:14px}
.notice.err{background:var(--crit-bg);color:var(--crit-ink)}
.notice a{color:inherit;font-weight:700}
.notice[hidden]{display:none}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 12px;flex-wrap:wrap}
.sec-head h2{font-size:16px;font-weight:650}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1100px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:620px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
.kpi .k-label{font-size:12.5px;color:var(--ink-2);font-weight:600}
.kpi .k-val{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:4px 0 6px;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .k-val small{font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.kpi .k-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}

/* Badges: icon + label, not color alone */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 3px;border-radius:999px;font-size:12.5px;font-weight:650;white-space:nowrap;line-height:1.5}
.badge i{font-style:normal;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;font-size:10.5px;font-weight:800;color:#fff}
.badge.g{background:var(--good-bg);color:var(--good-ink)} .badge.g i{background:var(--good)}
.badge.y{background:var(--warn-bg);color:var(--warn-ink)} .badge.y i{background:var(--warn);color:#3a2a00}
.badge.r{background:var(--crit-bg);color:var(--crit-ink)} .badge.r i{background:var(--crit)}
.badge.n{background:var(--surface-2);color:var(--muted);padding-left:9px}
.delta{font-size:12.5px;font-weight:600;white-space:nowrap}
.delta.up{color:var(--good-ink)} .delta.down{color:var(--crit-ink)} .delta.flat{color:var(--muted)}

/* Center cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media (max-width:360px){ .cards{grid-template-columns:1fr} }
.ccard{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.ccard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--stc,var(--border))}
.ccard.g{--stc:var(--good)} .ccard.y{--stc:var(--warn)} .ccard.r{--stc:var(--crit)}
.ccard.empty{background:transparent;border-style:dashed;box-shadow:none}
.c-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.c-name{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;letter-spacing:.02em}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.metric{display:flex;flex-direction:column;gap:4px;min-width:0}
.metric .m-label{font-size:11.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.metric .m-val{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.metric .m-val small{font-size:12.5px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.metric .m-row{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:2px;position:relative}
.bar span{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-2);border-radius:1px}
.c-foot{font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--border);padding-top:10px;display:flex;gap:4px 14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.c-foot b{color:var(--ink)}

/* Trend table */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
table.trend{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:640px}
.trend th,.trend td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.trend tbody tr:last-child td{border-bottom:0}
.trend thead th{font-size:12px;color:var(--ink-2);font-weight:650;background:var(--surface-2)}
.trend th button{border:0;background:none;padding:2px 4px;border-radius:6px;cursor:pointer;font:inherit;color:inherit}
.trend th.cur button{background:var(--accent);color:var(--accent-ink)}
.trend .lbl{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:700;z-index:1}
.trend thead .lbl{background:var(--surface-2)}
.trend tr.area td{font-weight:700;background:var(--surface-2)}
.trend tr.area .lbl{background:var(--surface-2)}
.trend td.g{color:var(--good-ink)} .trend td.y{color:var(--warn-ink)} .trend td.r{color:var(--crit-ink)}
.trend td.g::before,.trend td.y::before,.trend td.r::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.trend td.g::before{background:var(--good)} .trend td.y::before{background:var(--warn)} .trend td.r::before{background:var(--crit)}
.trend td.cur{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}

.empty-state{text-align:center;padding:40px 16px;border:1px dashed var(--border-2);border-radius:14px;background:var(--surface)}
.empty-state h2{font-size:17px;margin-bottom:6px}
.empty-state p{color:var(--ink-2);margin:0 auto;max-width:460px;font-size:14px}
.skel{height:180px;border-radius:14px;margin-bottom:12px;background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.4s infinite linear;border:1px solid var(--border)}
@keyframes sh{to{background-position:-200% 0}}
.foot{font-size:12.5px;color:var(--muted);margin:24px 0 8px;display:grid;gap:4px}
.foot a{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--page);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){ .toast{bottom:28px} }
@media (prefers-reduced-motion: reduce){ .toast{transition:none} .skel,.btn.spin svg{animation:none} }
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 16c2 0 2-1.5 4-1.5s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/><path d="M2 20c2 0 2-1.5 4-1.5s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/><circle cx="15" cy="6" r="2"/><path d="M5 12l4-4 3 2 4-1"/></svg></div>
    <div class="brand">
      <h1>Rekap Area</h1>
      <p>KLM · KWC · PML · BTU · TMP · HIB</p>
    </div>
    <div class="right">
      <span class="sync" id="status">Memuat…</span>
      <button class="btn icon" id="pullBtn" type="button" aria-label="Tarik ulang data"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
    </div>
    <nav class="appnav" aria-label="Pilih dashboard">
      <a href="./" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Rekap</a>
      <a href="../sa/"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5"/><path d="M16 11l2 2 3.5-4"/></svg>SA</a>
      <a href="../slot-map/"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/><path d="M8 4v16M16 4v16"/></svg>Slot Map</a>
    </nav>
  </div>
</header>

<div class="weekbar">
  <div class="wrap wb">
    <div class="seg" id="modeSeg" role="group" aria-label="Jenis periode">
      <button type="button" data-mode="day" aria-pressed="false">Harian</button>
      <button type="button" data-mode="week" aria-pressed="true">Mingguan</button>
      <button type="button" data-mode="month" aria-pressed="false">Bulanan</button>
    </div>
    <div class="wb-nav">
      <button class="btn icon" id="wPrev" type="button" aria-label="Periode sebelumnya">‹</button>
      <select id="wSel" aria-label="Pilih periode"></select>
      <input type="date" id="dSel" aria-label="Pilih tanggal" hidden>
      <button class="btn icon" id="wNext" type="button" aria-label="Periode berikutnya">›</button>
    </div>
    <button class="btn sm" id="wLatest" type="button">Terbaru</button>
  </div>
</div>

<main class="wrap">
  <div class="notice err" id="errBox" hidden></div>
  <div id="view"><div class="skel"></div><div class="skel"></div></div>
  <div class="foot" id="foot"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ================= Konfigurasi ================= */
// Tiga Sheet feed dari Exboard. Agar bisa dibaca dari luar claude.ai, tiap Sheet harus dibagikan
// "Siapa saja yang memiliki link" (Viewer).
const SRC = {
  // Satu baris per center per minggu (Acquisition = Paid DP + Paid Full). Dipakai selama tabel harian belum ada.
  week:  {id:'122A4RyzPQQzyLU8Q8dpv8KYn7D6SBLJtn4BMlwnkQtc', name:'Feed Rekap Mingguan Area', cache:'rekapLite.cache.v1'},
  // IMPORTRANGE tab "02 Acquisition": bulan berjalan per center (Acquisition & Revenue versi Exboard).
  month: {id:'1AENDIBlBmmf6K9axK06RdvDCDgUHw_6kqDeAjcT7ww4', name:'Feed Rekap Bulanan', cache:'rekapLite.month.v1'},
  // IMPORTRANGE tab "Feed Harian": satu baris per tanggal per center (Acquisition = FP SD, Revenue dari Revenue Record).
  day:   {id:'1rUNdkegRQQ6PICdcb1-9uQzTZAfQk8e_vPDMNX8zmyw', name:'Feed Rekap Harian', cache:'rekapLite.day.v1'}
};
const CENTERS = ['KLM','KWC','PML','BTU','TMP','HIB'];
const CCOLOR = {KLM:'var(--s1)',KWC:'var(--s2)',PML:'var(--s3)',BTU:'var(--s4)',TMP:'var(--s5)',HIB:'var(--s6)'};
// Threshold sama dengan bawaan dashboard Rekap Mingguan Area di claude.ai
const TH = { acq:{green:100, red:90}, rev:{green:100, red:90}, cvr:{green:45, red:35}, dp:{green:80, red:70} };
const ST = { g:{label:'Hijau', icon:'✓', rank:0, emoji:'🟢'}, y:{label:'Kuning', icon:'!', rank:1, emoji:'🟡'}, r:{label:'Merah', icon:'✕', rank:2, emoji:'🔴'} };
const UI_KEY = 'rekapLite.ui.v1';
const LAST_KEY = 'dashboardApp.last';
const STALE_MS = 5 * 60 * 1000;      // tarik ulang otomatis saat app dibuka lagi setelah 5 menit
const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const BULAN_PJG = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const HARI_PJG = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

/* ================= Util ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (v, d=1) => (v==null || isNaN(v)) ? '—' : Number(v).toLocaleString('id-ID',{maximumFractionDigits:d});

/* ================= Tanggal ================= */
const pad2 = n => String(n).padStart(2,'0');
const isoOf = d => d.getUTCFullYear() + '-' + pad2(d.getUTCMonth()+1) + '-' + pad2(d.getUTCDate());
const dateOf = s => { const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y, m-1, d)); };
const addDays = (s, n) => { const d = dateOf(s); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
const TODAY = (() => { const n = new Date(); return n.getFullYear() + '-' + pad2(n.getMonth()+1) + '-' + pad2(n.getDate()); })();
const CUR_MONTH = TODAY.slice(0,7);
const daysInMonth = m => { const [y,mo] = m.split('-').map(Number); return new Date(Date.UTC(y, mo, 0)).getUTCDate(); };
function shiftMonth(m, n){ let [y, mo] = m.split('-').map(Number); mo += n; y += Math.floor((mo-1)/12); mo = ((mo-1)%12+12)%12+1; return y + '-' + pad2(mo); }

/* ISO week (Senin–Minggu) */
function isoWeekUTC(t){
  const d = new Date(t.getTime()), day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const y = d.getUTCFullYear();
  return y + '-W' + String(Math.ceil(((d - Date.UTC(y,0,1)) / 86400000 + 1) / 7)).padStart(2,'0');
}
function mondayOf(key){
  const [y,w] = key.split('-W').map(Number), jan4 = new Date(Date.UTC(y,0,4)), d = jan4.getUTCDay() || 7;
  const mon = new Date(jan4.getTime()); mon.setUTCDate(jan4.getUTCDate() - d + 1 + (w-1)*7);
  return mon;
}
function shiftWeek(key, n){ const m = mondayOf(key); m.setUTCDate(m.getUTCDate() + 7*n); return isoWeekUTC(m); }
const weekNo = key => 'W' + key.split('-W')[1];
function weekRange(key){
  const a = mondayOf(key), b = new Date(a.getTime()); b.setUTCDate(b.getUTCDate()+6);
  const d1=a.getUTCDate(), m1=a.getUTCMonth(), y1=a.getUTCFullYear(), d2=b.getUTCDate(), m2=b.getUTCMonth(), y2=b.getUTCFullYear();
  if (y1!==y2) return `${d1} ${BULAN[m1]} ${y1} – ${d2} ${BULAN[m2]} ${y2}`;
  if (m1!==m2) return `${d1} ${BULAN[m1]} – ${d2} ${BULAN[m2]} ${y2}`;
  return `${d1}–${d2} ${BULAN[m2]} ${y2}`;
}
const CUR_WEEK = isoWeekUTC(dateOf(TODAY));
const dayText = k => { const d = dateOf(k); return `${HARI_PJG[d.getUTCDay()]}, ${d.getUTCDate()} ${BULAN[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const monthText = k => `${BULAN_PJG[+k.slice(5)-1]} ${k.slice(0,4)}`;
const upToToday = () => `s.d. ${Number(TODAY.slice(8))} ${BULAN[+TODAY.slice(5,7)-1]}`;

// Aturan tiap jenis periode: kunci, pembanding, dan label
const P = {

  }
};

/* ================= Baca feed ================= */
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i=0; i<text.length; i++){
    const ch = text[i];
    if (q){
      if (ch==='"'){ if (text[i+1]==='"'){ cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch==='"') q = true;
    else if (ch===','){ row.push(cell); cell = ''; }
    else if (ch==='\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch!=='\r') cell += ch;
  }
  if (cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
// Angka dari CSV Sheets: "34.9", "34,9", "328553000", "328,553,000", "328.553.000", "-" (kosong)
function sheetNum(s){
  s = String(s==null?'':s).trim().replace(/\s|Rp|%/g,'');
  if (s==='' || s==='-' || s[0]==='#') return null;
  if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
  if (/^-?\d+,\d{1,2}$/.test(s)) return Number(s.replace(',', '.'));
  if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) return Number(s.replace(/,/g,''));
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) return Number(s.replace(/\./g,'').replace(',', '.'));
  const n = Number(s); return isFinite(n) ? n : null;
}
const refErrIn = text => /#REF!/.test(text.slice(0, 400));
// CVR = total paid / show up, DP → FP = paid full / total paid (sama dengan tab 02 Acquisition)
function entry(o){
  const paid = (o.paidDp||0) + (o.paidFull||0);
  o.actual = o.actual || 0;
  o.cvr = o.showUp > 0 ? paid/o.showUp*100 : null;
  o.dpfp = paid > 0 ? (o.paidFull||0)/paid*100 : null;
  return o;
}

// Mingguan. Kolom: Minggu, Senin, Center, Show Up, Paid DP, Paid Full, Acquisition, Target Acquisition, Revenue, Target Revenue, CVR %, DP to FP %
function parseWeek(text){
  const rows = parseCSV(text);
  const hi = rows.findIndex(r => (r[0]||'').trim()==='Minggu' && (r[2]||'').trim()==='Center');
  if (hi < 0) return {entries:[], refErr: refErrIn(text)};
  const entries = [];
  for (const r of rows.slice(hi+1)){
    const wk = (r[0]||'').trim(), c = (r[2]||'').trim().toUpperCase();
    if (!/^\d{4}-W\d{2}$/.test(wk) || !CENTERS.includes(c)) continue;
    const [showUp, dp, full, acq, tgtA, rev, tgtR, cvr, dpfp] = [3,4,5,6,7,8,9,10,11].map(i => sheetNum(r[i]));
    entries.push({center:c, key:wk, showUp, paidDp:dp, paidFull:full,
      actual: acq||0, target: tgtA>0 ? tgtA : null,
      cvr: showUp>0 ? cvr : null, dpfp: (acq||0)>0 ? dpfp : null,
      rev, revTarget: tgtR>0 ? tgtR : null});
  }
  return {entries};
}

// Bulanan: tab "02 Acquisition", bagian A (per center) untuk Reporting Month di Exboard
const MONTHS_EN = ['january','february','march','april','may','june','july','august','september','october','november','december'];
const MONTHS_ID = BULAN_PJG.map(m => m.toLowerCase());
function monthKey(s){
  const m = /([A-Za-z]+)\s+(\d{4})/.exec(s || ''); if (!m) return null;
  const n = m[1].toLowerCase();
  let i = MONTHS_EN.indexOf(n); if (i < 0) i = MONTHS_ID.indexOf(n);
  if (i < 0) i = MONTHS_EN.findIndex(x => x.slice(0,3)===n.slice(0,3));
  return i < 0 ? null : m[2] + '-' + pad2(i+1);
}
function parseMonth(text){
  const rows = parseCSV(text);
  const pr = rows.find(r => norm(r[0]).startsWith('reporting month'));
  const key = pr ? monthKey(pr[1]) : null;
  const hi = rows.findIndex(r => norm(r[0])==='center' && norm(r[1])==='leads');
  if (!key || hi < 0) return {entries:[], refErr: refErrIn(text)};
  const head = rows[hi].map(norm), col = n => head.indexOf(n);
  const ix = {showUp:col('show up'), paidDp:col('paid dp'), paidFull:col('paid full'),
    acq: col('acquisition') >= 0 ? col('acquisition') : col('fp sd'), rev:col('revenue'), tgtR:col('target rev'), tgtA:col('target')};
  const raw = [];
  for (const r of rows.slice(hi+1)){
    const c = (r[0]||'').trim().toUpperCase();
    if (c==='TOTAL' || /^[A-Z]\.\s/.test(r[0]||'')) break;
    if (!CENTERS.includes(c)) continue;
    const v = k => ix[k] >= 0 ? sheetNum(r[ix[k]]) : null;
    raw.push({center:c, showUp:v('showUp'), paidDp:v('paidDp'), paidFull:v('paidFull'), acq:v('acq'), rev:v('rev'), tgtR:v('tgtR'), tgtA:v('tgtA')});
  }
  // Exboard menampilkan Revenue & Target Rev dalam ribuan rupiah (600,000 = Rp 600 jt)
  const unit = raw.some(e => e.tgtR > 0 && e.tgtR < 1e7) ? 1000 : 1;
  // Bulan berjalan: target dipro-rata sampai hari ini, sama seperti "Ach vs Run-Rate" di Exboard
  const dim = daysInMonth(key), frac = key===CUR_MONTH ? Math.min(Number(TODAY.slice(8)), dim)/dim : key < CUR_MONTH ? 1 : 0;
  const entries = raw.map(e => entry({center:e.center, key, showUp:e.showUp, paidDp:e.paidDp, paidFull:e.paidFull,
    actual:e.acq, rev: e.rev!=null ? e.rev*unit : null,
    target: e.tgtA > 0 && frac > 0 ? e.tgtA*frac : null, revTarget: e.tgtR > 0 && frac > 0 ? e.tgtR*unit*frac : null}));
  return {entries};
}

// Harian: tab "Feed Harian" di Exboard. Kolom: Tanggal (yyyy-mm-dd), Center, Show Up, Paid DP, Paid Full,
// Acquisition, Revenue, Target Acquisition, Target Revenue (target = target bulanan ÷ jumlah hari bulan itu)
function parseDate(s){
  s = String(s||'').trim(); let m;
  if ((m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s))) return `${m[1]}-${m[2]}-${m[3]}`;
  if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s))) return `${m[3]}-${pad2(m[1])}-${pad2(m[2])}`;
  return null;
}
function parseDay(text){
  const rows = parseCSV(text);
  const hi = rows.findIndex(r => norm(r[0])==='tanggal' && norm(r[1])==='center');
  if (hi < 0) return {entries:[], refErr: refErrIn(text)};
  const head = rows[hi].map(norm), col = n => head.indexOf(n);
  const ix = {showUp:col('show up'), paidDp:col('paid dp'), paidFull:col('paid full'), acq:col('acquisition'),
    rev:col('revenue'), tgtA:col('target acquisition'), tgtR:col('target revenue')};
  const raw = [];
  for (const r of rows.slice(hi+1)){
    const key = parseDate(r[0]), c = (r[1]||'').trim().toUpperCase();
    if (!key || key > TODAY || !CENTERS.includes(c)) continue;
    const v = k => ix[k] >= 0 ? sheetNum(r[ix[k]]) : null;
    raw.push({center:c, key, showUp:v('showUp'), paidDp:v('paidDp'), paidFull:v('paidFull'), actual:v('acq'), rev:v('rev'), target:v('tgtA'), revTarget:v('tgtR')});
  }
  // Target revenue harian ± Rp 20 jt; kalau tercatat ribuan (± 20.000), revenue juga ribuan
  const maxT = Math.max(0, ...raw.map(e => e.revTarget || 0));
  const unit = maxT > 0 && maxT < 1e6 ? 1000 : 1;
  raw.forEach(e => { if (e.rev!=null) e.rev *= unit; if (e.revTarget!=null) e.revTarget *= unit; });
  return {entries: raw.map(entry)};
}
const PARSE = {week: parseWeek, month: parseMonth, day: parseDay};

// Harian → mingguan / bulanan: jumlahkan hitungan & target, lalu hitung ulang rasio
function rollup(daily, keyOf){
  const m = new Map();
  for (const d of daily){
    const k = keyOf(d.key), id = d.center + '|' + k;
    const a = m.get(id) || {center:d.center, key:k, showUp:0, paidDp:0, paidFull:0, actual:0, rev:0, target:0, revTarget:0};
    ['showUp','paidDp','paidFull','actual','rev','target','revTarget'].forEach(f => a[f] += d[f] || 0);
    m.set(id, a);
  }
  return [...m.values()].map(entry);
}

async function fetchPublicCsv(id){
  const urls = [
    `https://docs.google.com/spreadsheets/d/${id}/export?format=csv`,
    `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv`
  ];
  let lastErr = null;
  for (const u of urls){
    try {
      const r = await fetch(u, {cache:'no-store', credentials:'omit'});
      if (!r.ok){ lastErr = {code:'http', status:r.status}; continue; }
      const t = await r.text();
      if (/^\s*<(!doctype|html)/i.test(t)){ lastErr = {code:'private'}; continue; }   // halaman login Google
      return t;
    } catch(e){ lastErr = {code: navigator.onLine === false ? 'offline' : 'blocked', message: e && e.message}; }
  }
  throw lastErr || {code:'blocked'};
}

/* ================= Status ================= */
const statusBy = (k, v) => (v==null || isNaN(v)) ? null : v>=TH[k].green ? 'g' : v>=TH[k].red ? 'y' : 'r';
function worst(...s){ s = s.filter(Boolean); return s.length ? s.sort((a,b) => ST[b].rank - ST[a].rank)[0] : null; }
function derive(e){
  if (!e) return null;
  const pct = e.target>0 ? e.actual/e.target*100 : null;
  const revPct = (has(e.rev) && e.revTarget>0) ? e.rev/e.revTarget*100 : null;
  const dp = has(e.dpfp) ? Number(e.dpfp) : null;
  const sAcq = statusBy('acq', pct), sCvr = statusBy('cvr', e.cvr), sRev = statusBy('rev', revPct), sDp = statusBy('dp', dp);
  return Object.assign({}, e, {pct, revPct, dp, sAcq, sCvr, sRev, sDp, sAll: worst(sAcq, sRev, sCvr, sDp)});
}
function badge(s, text){
  if (!s) return `<span class="badge n">${esc(text||'—')}</span>`;
  return `<span class="badge ${s}"><i aria-hidden="true">${ST[s].icon}</i>${esc(text||ST[s].label)}</span>`;
}
function delta(cur, prev){
  if (cur==null || prev==null || isNaN(cur) || isNaN(prev)) return '';
  const d = round1(cur - prev);
  if (d===0) return `<span class="delta flat">= 0 pt</span>`;
  return `<span class="delta ${d>0?'up':'down'}">${d>0?'▲ +':'▼ −'}${fmt(Math.abs(d))} pt</span>`;
}
const stColor = s => s==='g'?'var(--good)':s==='y'?'var(--warn)':s==='r'?'var(--crit)':'var(--axis)';
function progressBar(pct, s){
  if (pct==null) return '';
  const max = 130, bw = Math.min(Math.max(pct,0), max)/max*100, tick = 100/max*100;
  return `<div class="bar" aria-hidden="true"><span style="width:${bw}%;background:${stColor(s)}"></span><i class="tick" style="left:calc(${tick}% - 1px)"></i></div>`;
}

/* ================= State ================= */
const raw = {week:null, month:null, day:null};       // {entries, pulledAt} per feed
let store = {};                                      // per jenis periode: {idx, keys, src}
let ui = Object.assign({mode:'week'}, lsGet(UI_KEY) || {});
if (!P[ui.mode]) ui.mode = 'week';
const sel = {day:null, week:null, month:null};
let pulling = false;

const active = e => (e.showUp||0) + (e.actual||0) + (e.rev||0) > 0;
function mk(list, src){
  list = list.filter(active);
  return {idx: new Map(list.map(e => [e.center + '|' + e.key, e])), keys: [...new Set(list.map(e => e.key))].sort().reverse(), src};
}
// Tabel harian (Acquisition = FP SD Exboard) jadi sumber utama untuk ketiga periode supaya angkanya konsisten.
// Selama belum ada: mingguan dari feed mingguan, bulanan dari tab 02 Acquisition.
function build(){
  const daily = raw.day && raw.day.entries.length ? raw.day.entries : null;
  if (daily){
    const first = daily.reduce((a, e) => e.key < a ? e.key : a, TODAY);
    store.day = mk(daily, 'day');
    store.week = mk(rollup(daily, k => isoWeekUTC(dateOf(k))).filter(e => isoOf(mondayOf(e.key)) >= first), 'day');
    store.month = mk(rollup(daily, k => k.slice(0,7)).filter(e => e.key + '-01' >= first), 'day');
  } else {
    store.day = null;
    store.week = raw.week ? mk(raw.week.entries, 'week') : null;
    store.month = raw.month ? mk(raw.month.entries, 'month') : null;
  }
  Object.keys(P).forEach(m => { const s = store[m]; if (s && (!sel[m] || !s.keys.includes(sel[m]) && m!=='day')) sel[m] = defaultKey(m); });
}
function defaultKey(m){ const s = store[m]; if (!s) return P[m].cur; return s.keys.find(k => k <= P[m].cur) || s.keys[0] || P[m].cur; }
const cur = () => store[ui.mode];
const key = () => sel[ui.mode] || defaultKey(ui.mode);
const get = (c, k) => { const s = cur(); return s ? s.idx.get(c + '|' + k) || null : null; };
function periodRows(k){
  const pk = P[ui.mode].prev(k);
  return CENTERS.map(c => ({center:c, e: derive(get(c, k)), p: derive(get(c, pk))}));
}
function areaTotals(rows){
  const f = rows.filter(r => r.e);
  if (!f.length) return null;
  const withT = f.filter(r => r.e.target>0);
  const act = f.reduce((a,r) => a + r.e.actual, 0), tgt = withT.reduce((a,r) => a + r.e.target, 0);
  const pct = tgt>0 ? withT.reduce((a,r) => a + r.e.actual, 0)/tgt*100 : null;
  const fc = f.filter(r => has(r.e.cvr)), cvr = fc.length ? fc.reduce((a,r) => a + Number(r.e.cvr), 0)/fc.length : null;
  const fr = f.filter(r => r.e.revPct!=null);
  const rev = fr.length ? fr.reduce((a,r) => a + r.e.rev, 0) : null, revT = fr.length ? fr.reduce((a,r) => a + r.e.revTarget, 0) : null;
  const revPct = revT>0 ? rev/revT*100 : null;
  const fd = f.filter(r => r.e.dp!=null), dp = fd.length ? fd.reduce((a,r) => a + r.e.dp, 0)/fd.length : null;
  const showUp = f.reduce((a,r) => a + (r.e.showUp||0), 0);
  const dist = {g:0,y:0,r:0}; f.forEach(r => r.e.sAll && dist[r.e.sAll]++);
  return {n:f.length, act, tgt, pct, cvr, rev, revT, revPct, dp, showUp, dist,
    sAcq:statusBy('acq', pct), sCvr:statusBy('cvr', cvr), sRev:statusBy('rev', revPct), sDp:statusBy('dp', dp)};
}

function setupHint(){
  return `<div class="empty-state"><h2>Harian belum aktif</h2><p>Angka per tanggal dibaca dari tab <b>Feed Harian</b> di Exboard lewat <a href="${feedUrl('day')}" target="_blank" rel="noopener">Feed Rekap Harian</a>. Pastikan tab itu sudah dibuat, feed-nya sudah diberi izin (klik A1 → Allow access) dan dibagikan "Siapa saja yang memiliki link". Setelah itu mode Harian aktif otomatis dan Mingguan / Bulanan ikut memakai angka yang sama.</p></div>`;
}

function render(){
  renderBar();
  renderFoot();
  const el = $('#view'), m = ui.mode, s = cur();
  if (!s){
    if (m==='day'){ el.innerHTML = setupHint(); return; }
    if (!pulling) el.innerHTML = `<div class="empty-state"><h2>Belum ada data</h2><p>Data belum pernah berhasil ditarik di perangkat ini. Periksa pesan di atas, lalu ketuk tombol tarik ulang.</p></div>`;
    return;
  }
  const k = key(), rows = periodRows(k), tot = areaTotals(rows), ptot = areaTotals(periodRows(P[m].prev(k)));
  const dP = (a, b) => ptot ? delta(a, b) : '';
  const tgtNote = (m==='month' && k===CUR_MONTH) || (m==='week' && k===CUR_WEEK && s.src==='day') ? '<span>target s.d. hari ini</span>' : '';

  const kpis = tot ? `<div class="kpis">
    <div class="kpi"><div class="k-label">Acquisition area</div>
      <div class="k-val">${fmt(tot.act,0)} <small>/ ${fmt(tot.tgt,1)}</small></div>
      <div class="k-foot">${badge(tot.sAcq, fmtPct(tot.pct,0))}${dP(tot.pct, ptot&&ptot.pct)}${tgtNote}</div></div>
    <div class="kpi"><div class="k-label">Revenue area</div>
      <div class="k-val">${tot.rev!=null ? fmtRpS(tot.rev) : '—'}</div>
      <div class="k-foot">${tot.rev!=null ? `${badge(tot.sRev, fmtPct(tot.revPct,0))}<span>dari ${fmtRpS(tot.revT)}</span>${dP(tot.revPct, ptot&&ptot.revPct)}` : '<span class="muted">Belum ada data</span>'}</div></div>
    <div class="kpi"><div class="k-label">Rata-rata CVR</div>
      <div class="k-val">${fmtPct(tot.cvr)}</div>
      <div class="k-foot">${badge(tot.sCvr)}${dP(tot.cvr, ptot&&ptot.cvr)}</div></div>
    <div class="kpi"><div class="k-label">Rata-rata DP → FP</div>
      <div class="k-val">${fmtPct(tot.dp)}</div>
      <div class="k-foot">${tot.dp!=null ? badge(tot.sDp) + dP(tot.dp, ptot&&ptot.dp) : '<span class="muted">Belum ada data</span>'}</div></div>
    <div class="kpi"><div class="k-label">Show up</div>
      <div class="k-val">${fmt(tot.showUp,0)}</div>
      <div class="k-foot">${ptot ? `<span>${esc(P[m].prevShort(k))} ${fmt(ptot.showUp,0)}</span>` : ''}</div></div>
    <div class="kpi"><div class="k-label">Status center</div>
      <div class="k-val">${tot.dist.r} <small>merah</small></div>
      <div class="k-foot">${tot.dist.g?badge('g', tot.dist.g+' Hijau'):''}${tot.dist.y?badge('y', tot.dist.y+' Kuning'):''}${tot.dist.r?badge('r', tot.dist.r+' Merah'):''}</div></div>
  </div>` : `<div class="empty-state"><h2>Belum ada data untuk ${esc(P[m].label(k))}</h2><p>Tidak ada aktivitas tercatat. Pilih ${P[m].noun} lain di atas.</p></div>`;

  const metric = (label, val, b, bar, d) => `<div class="metric"><div class="m-label">${label}</div><div class="m-val">${val}</div><div class="m-row">${b}${d||''}</div>${bar||''}</div>`;
  const cards = rows.map(r => {
    const dot = `<span class="dot" style="background:${CCOLOR[r.center]}"></span>`;
    if (!r.e) return `<div class="ccard empty"><div class="c-head"><div class="c-name">${dot}${r.center}</div>${badge(null,'Tidak ada aktivitas')}</div></div>`;
    const e = r.e, p = r.p;
    return `<article class="ccard ${e.sAll||''}">
      <div class="c-head"><div class="c-name">${dot}${r.center}</div>${badge(e.sAll)}</div>
      <div class="mgrid">
        ${metric('Acquisition', `${fmt(e.actual,0)} <small>/ ${fmt(e.target,1)}</small>`, badge(e.sAcq, fmtPct(e.pct,0)), progressBar(e.pct, e.sAcq), delta(e.pct, p&&p.pct))}
        ${metric('Revenue', e.revPct!=null ? `${fmtRpS(e.rev)} <small>/ ${fmtRpS(e.revTarget).replace('Rp ','')}</small>` : fmtRpS(e.rev), e.revPct!=null ? badge(e.sRev, fmtPct(e.revPct,0)) : badge(null,'Tanpa target'), progressBar(e.revPct, e.sRev), delta(e.revPct, p&&p.revPct))}
        ${metric('CVR', fmtPct(e.cvr), badge(e.sCvr), '', delta(e.cvr, p&&p.cvr))}
        ${metric('DP → FP', fmtPct(e.dp), e.dp!=null ? badge(e.sDp) : badge(null,'—'), '', delta(e.dp, p&&p.dp))}
      </div>
      <div class="c-foot"><span>Show up <b>${fmt(e.showUp,0)}</b></span><span>Paid DP <b>${fmt(e.paidDp,0)}</b></span><span>Paid Full <b>${fmt(e.paidFull,0)}</b></span></div>
    </article>`;
  }).join('');

  const srcNote = s.src==='week' ? ' Acquisition mingguan saat ini = Paid DP + Paid Full dari feed mingguan; setelah tab Feed Harian ada, beralih ke Acquisition (FP SD) Exboard.'
    : s.src==='month' ? ' Bulanan diambil dari tab 02 Acquisition (Acquisition & Revenue versi Exboard); hanya bulan yang sedang dipilih di Reporting Month Exboard.' : '';
  const tn = P[m].trendN;
  el.innerHTML = `${kpis}
    <div class="sec-head"><h2>Per center · ${esc(P[m].label(k))}</h2>
      <button class="btn sm" id="copyBtn" type="button" ${tot?'':'disabled'}><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>Salin ringkasan (WA)</button>
    </div>
    <div class="cards">${cards}</div>
    <p class="note">▲▼ = perubahan dibanding ${P[m].prevNote} (poin persen). Status center = yang terburuk dari Acquisition, Revenue, CVR, dan DP → FP.${esc(srcNote)}</p>
    <div class="sec-head"><h2>Tren acquisition vs target · ${tn} ${P[m].noun}</h2><span class="note" style="margin:0">Ketuk kolom untuk membukanya</span></div>
    <div class="table-wrap">${trendTable(k)}</div>
    <p class="note">Hijau ≥${TH.acq.green}% target, Kuning ${TH.acq.red}–${TH.acq.green}%, Merah &lt;${TH.acq.red}%. CVR: hijau ≥${TH.cvr.green}%, merah &lt;${TH.cvr.red}%. DP → FP: hijau ≥${TH.dp.green}%, merah &lt;${TH.dp.red}%.</p>`;
  // Periode terpilih ada di kolom paling kanan: geser tabel tren ke kanan agar langsung terlihat di HP
  const tw = el.querySelector('.table-wrap'); if (tw) tw.scrollLeft = tw.scrollWidth;
}

function trendTable(end){
  const m = ui.mode, s = cur(), n = P[m].trendN;
  let ks;
  if (m==='day'){ ks = []; for (let i = n-1; i >= 0; i--) ks.push(addDays(end, -i)); }
  else { const i = s.keys.indexOf(end); ks = (i < 0 ? [] : s.keys.slice(i, i + n)).reverse(); }
  if (!ks.length) return '<p class="note" style="padding:12px">Belum ada data tren.</p>';
  const cell = (e, k) => {
    if (!e) return `<td class="${k===end?'cur':''}"><span class="muted">—</span></td>`;
    return `<td class="${e.sAcq||''} ${k===end?'cur':''}" title="${esc(e.center||'Area')} ${esc(P[m].short(k))}: ${fmt(e.act!=null?e.act:e.actual,0)} / ${fmt(e.tgt!=null?e.tgt:e.target,1)}">${fmtPct(e.pct,0)}</td>`;
  };
  const head = ks.map(k => `<th class="${k===end?'cur':''}"><button type="button" data-key="${k}" title="${esc(P[m].label(k))}">${esc(P[m].short(k))}</button></th>`).join('');
  const body = CENTERS.map(c => `<tr><td class="lbl"><span class="dot" style="display:inline-block;margin-right:6px;background:${CCOLOR[c]}"></span>${c}</td>${ks.map(k => cell(derive(get(c,k)), k)).join('')}</tr>`).join('');
  const area = `<tr class="area"><td class="lbl">Area</td>${ks.map(k => cell(areaTotals(periodRows(k)), k)).join('')}</tr>`;
  return `<table class="trend"><thead><tr><th class="lbl">Center</th>${head}</tr></thead><tbody>${body}${area}</tbody></table>`;
}

const feedUrl = m => `https://docs.google.com/spreadsheets/d/${SRC[m].id}/edit`;
function renderFoot(){
  const s = cur(), parts = [];
  if (s && raw[s.src]) parts.push(`<span>Ditarik ${esc(fmtTime(raw[s.src].pulledAt))}.</span>`);
  const src = s ? s.src : (ui.mode==='day' ? 'day' : ui.mode);
  if (SRC[src].id) parts.push(`<span>Sumber: <a href="${feedUrl(src)}" target="_blank" rel="noopener">${esc(SRC[src].name)} (dari Exboard)</a>. Catatan coaching SA/CM hanya ada di dashboard claude.ai.</span>`);
  $('#foot').innerHTML = parts.join('');
}

function summaryText(){
  const m = ui.mode, k = key(), rows = periodRows(k), tot = areaTotals(rows);
  if (!tot) return '';
  const E = s => s ? ST[s].emoji : '⚪';
  const lines = [`*${P[m].title(k)}*`,
    `Acquisition: ${fmt(tot.act,0)}/${fmt(tot.tgt,1)} (${fmtPct(tot.pct,0)}) ${E(tot.sAcq)}`];
  if (tot.rev!=null) lines.push(`Revenue: ${fmtRpS(tot.rev)}/${fmtRpS(tot.revT).replace('Rp ','')} (${fmtPct(tot.revPct,0)}) ${E(tot.sRev)}`);
  lines.push(`Rata-rata CVR: ${fmtPct(tot.cvr)} ${E(tot.sCvr)}`);
  if (tot.dp!=null) lines.push(`Rata-rata DP → FP: ${fmtPct(tot.dp)} ${E(tot.sDp)}`);
  lines.push('');
  rows.forEach(r => {
    if (!r.e){ lines.push(`${r.center}: tidak ada aktivitas`); return; }
    const e = r.e, parts = [`Acq ${fmt(e.actual,0)}/${fmt(e.target,1)} (${fmtPct(e.pct,0)}) ${E(e.sAcq)}`];
    if (e.revPct!=null) parts.push(`Rev ${fmtRpS(e.rev)} (${fmtPct(e.revPct,0)}) ${E(e.sRev)}`);
    parts.push(`CVR ${fmtPct(e.cvr)} ${E(e.sCvr)}`);
    if (e.dp!=null) parts.push(`DP→FP ${fmtPct(e.dp)} ${E(e.sDp)}`);
    lines.push(`${E(e.sAll)} *${r.center}* — ${parts.join(' | ')}`);
  });
  const attn = rows.filter(r => r.e && r.e.sAll==='r').map(r => {
    const e = r.e, x = [e.sAcq==='r'?'Acq':'', e.sRev==='r'?'Revenue':'', e.sCvr==='r'?'CVR':'', e.sDp==='r'?'DP→FP':''].filter(Boolean);
    return `${r.center} (${x.join(', ')})`;
  });
  if (attn.length) lines.push('', `Perlu perhatian: ${attn.join('; ')}`);
  return lines.join('\n');
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(e2){}
    ta.remove(); return ok;
  }
}

/* ================= Tarik data ================= */
function errLine(m, err){
  const link = `<a href="${feedUrl(m)}" target="_blank" rel="noopener">${esc(SRC[m].name)}</a>`;
  if (err && err.code==='offline') return 'HP sedang offline.';
  if (err && err.code==='empty') return err.refErr ? `${link} belum bisa membaca Exboard: buka Sheet-nya, klik sel A1, lalu pilih "Allow access".`
    : `${link} belum berisi tabel yang dikenali.`;
  return `${link} belum bisa dibaca dari aplikasi ini. Buka Sheet-nya → Bagikan → Akses umum → <b>Siapa saja yang memiliki link</b> (Viewer).`;
}
function load(m, text, pulledAt){
  const p = PARSE[m](text);
  if (!p.entries.length) return p;
  raw[m] = {entries: p.entries, pulledAt};
  return p;
}
async function pullOne(m){
  if (!SRC[m].id) return;
  const text = await fetchPublicCsv(SRC[m].id);
  const now = Date.now(), p = load(m, text, now);
  if (!p.entries.length) throw {code:'empty', refErr: p.refErr};
  lsSet(SRC[m].cache, {text, pulledAt: now});
}
async function pull(){
  if (pulling) return;
  pulling = true; $('#pullBtn').disabled = true; $('#pullBtn').classList.add('spin');
  setStatus('busy', 'Menarik data…');
  const modes = Object.keys(SRC).filter(m => SRC[m].id);
  const res = await Promise.allSettled(modes.map(pullOne));
  build();
  const failed = modes.map((m, i) => [m, res[i]]).filter(([, r]) => r.status==='rejected');
  if (!failed.length){ setStatus('ok', 'Tersinkron · ' + fmtTime(Date.now())); showErr(''); }
  else {
    const offline = failed.some(([, r]) => r.reason && r.reason.code==='offline');
    setStatus('err', offline ? 'Offline' : failed.length===modes.length ? 'Gagal menarik' : 'Sebagian gagal');
    const uniq = [...new Set(failed.map(([m, r]) => errLine(m, r.reason)))];
    showErr(`<b>Sebagian data terbaru belum bisa ditarik.</b> ${uniq.join(' ')}${cur() ? ' Menampilkan data terakhir yang tersimpan.' : ''}`);
  }
  pulling = false; $('#pullBtn').disabled = false; $('#pullBtn').classList.remove('spin');
  render();
}

/* ================= Event ================= */
function setKey(k){ if (!k || k===sel[ui.mode]) return; sel[ui.mode] = k; render(); window.scrollTo({top:0}); }
function setMode(m){ if (!P[m] || m===ui.mode) return; ui.mode = m; lsSet(UI_KEY, ui); render(); }
$('#modeSeg').addEventListener('click', e => { const b = e.target.closest('button[data-mode]'); if (b) setMode(b.dataset.mode); });
$('#wSel').addEventListener('change', e => setKey(e.target.value));
$('#dSel').addEventListener('change', e => { const v = e.target.value; if (v && v <= TODAY) setKey(v); });
function step(dir){
  const m = ui.mode, s = cur(), k = key(); if (!s) return;
  if (m==='day'){ const n = addDays(k, dir); const min = s.keys[s.keys.length-1]; if (n <= TODAY && n >= min) setKey(n); return; }
  const i = s.keys.indexOf(k), j = i - dir;                // keys urut terbaru → terlama
  if (i >= 0 && j >= 0 && j < s.keys.length) setKey(s.keys[j]);
}
$('#wPrev').addEventListener('click', () => step(-1));
$('#wNext').addEventListener('click', () => step(1));
$('#wLatest').addEventListener('click', () => setKey(defaultKey(ui.mode)));
$('#pullBtn').addEventListener('click', pull);
$('#view').addEventListener('click', async e => {
  const kb = e.target.closest('button[data-key]');
  if (kb){ setKey(kb.dataset.key); return; }
  if (e.target.closest('#copyBtn')) toast(await copyText(summaryText()) ? 'Ringkasan disalin. Tempel di WhatsApp.' : 'Gagal menyalin ringkasan.');
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const s = cur(), last = s && raw[s.src] ? raw[s.src].pulledAt : 0;
  if (Date.now() - last > STALE_MS) pull();
});

/* ================= Mulai ================= */
try { localStorage.setItem(LAST_KEY, 'rekap'); } catch(e){}
Object.keys(SRC).forEach(m => {
  const c = lsGet(SRC[m].cache);
  if (SRC[m].id && c && typeof c.text === 'string') load(m, c.text, c.pulledAt);
});
build();
if (cur()) setStatus('', 'Data ' + fmtTime((raw[cur().src] || {}).pulledAt));
render();
pull();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(() => {});
})();
</script>
